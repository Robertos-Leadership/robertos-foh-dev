<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00575F">
<title>Roberto's Mare</title>
<link rel="icon" href="mare-logo-teal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Roberto's Mare — the management app (Milica, Andrea, Francesco).
     Signed-in FOH accounts with the 'mare' module (or Admin). Every read and
     write goes through mare_mgr_* / mare_m_* functions, which check that again
     in the database. Modules live in mare-mgr*.js; shared helpers and the
     English/Montenegrin switch in mare-common.js + mare-i18n.js. -->
<style>
:root{
  --teal:#00575F; --teal-2:#016A74; --teal-3:#0B7C86; --tint:#DCEBEC; --tint-2:#EEF5F5;
  --cream:#FAF5F0; --sand:#F1E8DC; --card:#FFFFFF; --line:#E6DCCF; --line-2:#F0E9DF;
  --ink:#1E2A2C; --muted:#4A5658; --soft:#EFE8DF;
  --red:#9B1C1C; --red-bg:#FDECEC; --amber:#7A4100; --amber-bg:#FFF3E0; --blue:#1E3A8A; --blue-bg:#E8EEFC; --green:#1F5E2E; --green-bg:#E5F2E7;
  --shadow:0 1px 2px rgba(30,42,44,.06),0 6px 22px rgba(30,42,44,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:Karla,system-ui,sans-serif;font-size:16px;line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.serif,.tile .nm,.rcard .tx b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* ── home ── */
.hero{position:relative;min-height:340px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:#0f3a3f url('mare-hero.jpg') center 60%/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,40,45,.55) 0%,rgba(0,40,45,.25) 40%,rgba(0,40,45,.78) 100%)}
.hero > *{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;max-width:1240px;margin:0 auto;width:100%;flex-wrap:wrap}
.hero-top .who{font-size:14px;opacity:.95}
.hero-top .lk{color:#fff;font-size:14px;opacity:.95;background:none;border:0;text-decoration:underline;padding:6px}
.hero-main{max-width:1240px;margin:0 auto;width:100%;padding:0 20px 52px;display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.hero-main img{width:96px;height:96px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
.hero-main h1{margin:0;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:1px}
.hero-main .sub{font-size:17px;opacity:.95;margin-top:6px}
@media (max-width:700px){ .hero{background-image:url('mare-hero-sm.jpg');min-height:280px} .hero-main img{width:70px;height:70px} }
.strip{max-width:1240px;margin:-34px auto 0;padding:0 20px;position:relative;z-index:2}
.strip-in{background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));overflow:hidden}
.stat{padding:16px 18px;border:0;border-right:1px solid var(--line-2);background:none;text-align:left}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:28px;line-height:1.1;color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.stat.alert b{color:var(--red)}
.groups{max-width:1240px;margin:0 auto;padding:30px 20px 60px;display:flex;flex-direction:column;gap:30px}
.grp h2{margin:0 0 12px;font-size:13px;letter-spacing:3px;color:var(--muted);font-weight:700;text-transform:uppercase;font-family:Karla,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;
  min-height:150px;box-shadow:0 1px 2px rgba(30,42,44,.04);transition:transform .12s ease,box-shadow .12s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ic{width:46px;height:46px;border-radius:14px;background:var(--tint);color:var(--teal);display:flex;align-items:center;justify-content:center}
.tile .nm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:25px;line-height:1.05;color:var(--ink)}
.tile .ds{font-size:14px;color:var(--muted)}
.tile .st{margin-top:auto;font-size:14px;font-weight:700;color:var(--teal)}
.tile .st.alert{color:var(--red)}
/* ── module screens ── */
.bar{background:var(--teal);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .home{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;min-height:44px}
.bar img{width:38px;height:38px}
.bar h1{margin:0;font-size:28px;flex:1;min-width:140px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.6);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:7px 12px;font-weight:700;font-size:13px;min-height:36px}
.lang button.on{background:#fff;color:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:16px 20px 0}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;min-height:42px;color:var(--muted)}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
main{max-width:1240px;margin:0 auto;padding:22px 20px 70px;display:flex;flex-direction:column;gap:26px}
h2{margin:0;font-size:30px;color:var(--teal)}
h3{margin:0;font-size:18px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(30,42,44,.04)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.8px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.amber{background:var(--amber-bg);color:var(--amber)} .tag.red{background:var(--red-bg);color:var(--red)} .tag.green{background:var(--green-bg);color:var(--green)}
.tag.blue{background:var(--blue-bg);color:var(--blue)} .tag.teal{background:var(--teal);color:#fff} .tag.grey{background:var(--soft);color:var(--muted)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;min-height:44px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #C9BEB1}
.btn.warn{background:#fff;color:var(--red);border:1px solid #E8B4B4}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],input[type=number],input[type=month],select,textarea{
  padding:9px 11px;border:1px solid #C9BEB1;border-radius:10px;background:#fff;min-height:44px;max-width:100%}
textarea{min-height:84px;width:100%;resize:vertical;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink);font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.box{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid #D8CFC4;white-space:nowrap;text-transform:uppercase;background:#FCFAF7}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.nw,th.nw{white-space:nowrap}
td.cell{cursor:pointer;white-space:nowrap} td.cell:hover{background:#F6F1EA} td.sel{outline:2px solid var(--teal);outline-offset:-2px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:9px;background:var(--tint);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi span{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;text-transform:uppercase}
.kpi b{display:block;font-size:26px;font-weight:700;color:var(--teal);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:13px;color:var(--muted)}
.kpi.red b{color:var(--red)} .kpi.green b{color:var(--green)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed #D8CFC4;border-radius:16px}
.overlay{position:fixed;inset:0;background:rgba(20,28,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay > .card{max-width:680px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.overlay img{width:100%;border-radius:10px}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;z-index:60;display:none;max-width:90vw}
.signin{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.signin input{width:100%}
.err{color:var(--red);font-weight:700}
.code{font-size:44px;letter-spacing:8px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:700;color:var(--teal)}
.rota td{white-space:nowrap;text-align:center;font-size:14px;padding:7px}
.rota td:first-child{text-align:left}
.shift{display:inline-block;border-radius:8px;padding:5px 8px;font-weight:700;background:var(--tint);color:var(--teal);min-width:96px;border:0;font-size:14px}
.shift.off{background:var(--soft);color:var(--muted)} .shift.leave{background:var(--blue-bg);color:var(--blue)} .shift.sick{background:var(--amber-bg);color:var(--amber)}
.shift.empty{background:transparent;color:#9A8F83;font-weight:400;border:1px dashed #D8CFC4}
.recipe-photo{width:100%;max-height:340px;object-fit:cover;border-radius:12px}
.pre{white-space:pre-wrap}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.chk:last-child{border-bottom:0}
.dot{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid #C9BEB1}
.dot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.rcard .ph{height:130px;background:var(--tint) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--teal)}
.rcard .tx{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rcard .tx b{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;line-height:1.1}
.vabar{position:sticky;top:0;z-index:30;background:#1E2A2C;color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;padding:10px 16px;font-weight:700}
.vabar button{background:#fff;color:#1E2A2C;border:0;border-radius:999px;padding:6px 14px;font-weight:700}
.vahero{position:relative;border-radius:18px;overflow:hidden;color:#fff;padding:34px 30px;background:#0f3a3f url('mare-hero.jpg') center 60%/cover no-repeat;box-shadow:var(--shadow)}
.vahero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,52,58,.94) 0%,rgba(0,52,58,.78) 45%,rgba(0,52,58,.25) 100%)}
.vahero > *{position:relative;max-width:620px}
.vahero .k{font-size:13px;letter-spacing:4px;font-weight:700;opacity:.9}
.vahero h2{color:#fff;font-size:42px;margin:6px 0 8px}
.varow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.varow:last-child{border-bottom:0}
.varow .who b{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;display:block;font-variant-numeric:lining-nums}
.varow .who span{font-size:14px;color:var(--muted)}
.varow .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.vabtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #C9BEB1;border-radius:999px;padding:9px 16px;font-weight:700;min-height:44px}
.ticks{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 20px 18px;background:#FCFAF7;border-bottom:1px solid var(--line-2)}
.ticks label{display:flex;align-items:center;gap:6px;font-size:15px}
.ticks input{width:20px;height:20px}
@media (max-width:640px){ .bar h1{font-size:23px} h2{font-size:26px} main{padding:18px 16px 60px}
  .wrap,.tabs,.bar-in,.groups,.strip,.hero-top,.hero-main{padding-left:16px;padding-right:16px} }
</style>
</head>
<body>
<div id="app"><div class="wrap muted" style="padding-top:40px">Loading…</div></div>
<div class="status" id="status" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="mare-i18n.js?v=20261006i"></script>
<script src="mare-common.js?v=20261006i"></script>
<script src="mare-mgr.js?v=20261006i"></script>
<script src="mare-mgr-ops.js?v=20261006i"></script>
<script src="mare-mgr-back.js?v=20261006i"></script>
<script src="mare-mgr-viewas.js?v=20261006i"></script>
<script>MareApp.start();</script>
</body>
</html>
