<html lang="en" translate="no">
<meta charset="utf-8">
<meta name="google" content="notranslate">
<!-- This page was the only one in the Kitchen without it. Without a viewport line a
     phone lays the page out at 980px and zooms out to fit, so everything under
     `@media (max-width:900px)` — the stacked hero, the readable text sizes, the photo
     frame sized to the screen — has never once run on a phone. The page has always
     been readable there only because it was shrunk to about a third.
     It matters more now: a dish is photographed on a phone, and the control for that
     was landing at a third of its size behind a hover state phones do not have. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roberto's Food &amp; Beverage Bible — one page, one dish, one glass</title>
<!-- The three venue rooms. They used to be pasted in here as base64 and made this
     file 1.28 MB: 646 KB of decoration that a phone re-downloaded in full every
     time either this page or the app was deployed, because an inline image cannot
     be cached on its own. They are now three files in img/ — fetched once, kept by
     the browser, and shared with any other screen that wants the same room.
     The SNAPSHOT photos further down stay inline on purpose: they are the offline
     fallback, and a fallback that needs a second request is not a fallback. -->
<script>var PHOTOS={"terrace":"img/room-terrace.jpg","crudo":"img/room-crudo.jpg","scala":"img/room-scala.jpg"};</script>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   ONE DISH = ONE A4. Everything the floor needs is on the page at once: no
   tabs, no scrolling to find the allergens, nothing that opens. It is sized in
   millimetres so what is on screen is exactly what comes out of the printer.
   Georgia and the system sans stand in for Cormorant Garamond and DM Sans,
   which cannot load on a hosted page.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --sabbia:#e1d3c2;--sabbia-light:#ede5d8;--sabbia-dark:#cfc0ad;
  --vino:#410207;--vino-mid:#5e0a10;--vino-deep:#2b0104;--vino-light:#7a1218;
  --oliva:#4b5128;--oro:#ba9b02;--oro-light:#d9bd3f;--ink:#2a1a10;--cream:#f5ede0;
  --paper:#fbf7f0;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#cdbba6;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
img{display:block;max-width:100%}

/* the desk the page sits on — screen only */
/* The desk the sheet lies on is the dining room at night — the Ristorante, from the
   house photograph library. It is scenery and nothing else: it carries no information,
   so it is screen-only and the print block below takes it straight back off. The room is
   held under a deep vino wash so it never competes with the sheet; what you should be
   reading is the paper, and the room only has to say whose paper it is. */
.desk{padding:0 0 60px;position:relative;background:#cdbba6;min-height:100vh}
.desk::before{content:'';position:absolute;inset:0;background:url(venue-ristorante.jpg) center/cover;
  pointer-events:none}
.desk::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(43,1,4,.55),rgba(43,1,4,.78))}
/* the sheet and the controls sit above the room, not in it */
.desk > *{position:relative;z-index:1}
/* ── laid out like every other Recipes screen (22 Sep 2026, Chef Andrea: "too messy") ──
   Recipe card and Current menu both open on the same three things: a small eyebrow and
   a serif title on the room, then ONE sand panel holding every control, left-aligned.
   This page had no title and floated seventeen menu buttons, the search, the picker,
   the arrows and Print centred over the photograph in four ragged rows - the arrow back
   on one line, the arrow forward on the next. Same column, same panel, same buttons as
   the recipe card now; the A4 sheet itself is untouched and prints exactly as before. */
.front{max-width:1080px;margin:0 auto;padding:44px 20px 0}
.eyebrow{font-size:10.5px;letter-spacing:3.4px;text-transform:uppercase;color:#f2d3b8;margin-bottom:14px}
.lede{font-family:var(--serif);font-size:clamp(32px,6vw,50px);line-height:1.08;color:#fbf3e9;
  margin:0;font-weight:400}
.onpaper{background:var(--sabbia);border-radius:10px;padding:18px 16px 24px;margin-top:22px;
  box-shadow:0 18px 40px -22px rgba(20,4,4,.8)}
.fbctl{display:flex;flex-direction:column;gap:12px}
.stale{color:var(--vino);font-weight:700}
/* the menu is ONE dropdown, first in the row (Francesco, 29 Sep 2026): seventeen menu
   buttons in four rows was the busiest thing on a page the floor opens for one dish.
   It opens on the running menu - the a la carte - and the rest are one tap away. */
.pickwrap select#mpick{font-weight:700}
.mnote{font-family:var(--sans);font-size:13px;color:var(--vino-light);line-height:1.5}
.mnote b{color:var(--vino)}
/* one row: find the dish on the left, walk and print on the right */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pickwrap{display:flex;align-items:center;gap:8px;flex:1 1 440px;min-width:0;flex-wrap:wrap}
.pickwrap select,.pickwrap input{flex:1 1 190px;min-width:0;height:44px;border:1px solid var(--sabbia-dark);
  border-radius:6px;background:#fff;color:var(--vino);font-family:var(--sans);font-size:14px;padding:0 12px}
/* 16px or iOS zooms the whole page in the second a waiter taps the box */
.pickwrap input{font-size:16px;outline:none}
.pickwrap input:focus{border-color:var(--vino)}
.pickwrap select:disabled{opacity:.5}
@media (pointer:coarse){ .pickwrap select,.pickwrap input{height:48px} }
.walk{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
.tools .btn{background:var(--vino);color:var(--cream);border:1px solid var(--vino);border-radius:5px;font-family:var(--sans);
  font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;padding:0 16px;height:44px;cursor:pointer;
  white-space:nowrap}
.tools .btn.ghost{background:#fff;color:var(--vino);border:1px solid var(--sabbia-dark)}
.tools .btn.ghost:hover{border-color:var(--vino)}
/* where you are in the book - state, so it stays on screen */
.fbstat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:12.5px;line-height:1.5;
  color:var(--vino-light)}
/* the page itself, laid on the panel like a sheet on the pass */
.fbpage{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:20px;position:relative}
/* Walking the menu: one arrow each side of the page (Chef Andrea, Tell us, 22 Sep).
   The forward button used to carry the NEXT dish's name ("CARCIOFI ->") right above
   the page of the dish you were on, and it read as the name of this one. An arrow
   names nothing, so it cannot be mistaken for the dish. Each arrow rides a rail the
   height of the page, just outside the A4, and sticks to the middle of the screen, so
   it is beside the page wherever you have scrolled to and never over the controls. */
.fbrail{position:absolute;top:0;bottom:0;width:56px;pointer-events:none}
.fbrail.l{left:calc(50% - 105mm - 72px)}
.fbrail.r{right:calc(50% - 105mm - 72px)}
.fbarrow{position:sticky;top:calc(50vh - 48px);pointer-events:auto;width:56px;height:96px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--vino);color:var(--cream);border:1px solid var(--vino);border-radius:6px;
  font-family:var(--sans);font-size:30px;line-height:1;box-shadow:0 8px 20px -10px rgba(20,4,4,.8)}
.fbarrow:hover{background:var(--vino-light)}
/* the panel is narrower than the A4 plus two arrows: sit on the page's margin instead */
@media screen and (min-width:901px) and (max-width:1060px){
  .fbrail.l{left:0}
  .fbrail.r{right:0}
}
/* the page is one A4 by design; when the writing outgrows it, say so rather than
   printing a second sheet nobody asked for and letting the allergens land on it */
.moved{width:100%;max-width:210mm;background:var(--vino);color:var(--cream);border-radius:3px;
  padding:12px 14px;font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.moved b{color:var(--oro-light)}
.moved .btn{margin-left:auto;background:var(--cream);color:var(--vino);border:none;border-radius:4px;
  font-family:var(--sans);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;
  padding:0 16px;height:44px;cursor:pointer}
.over{font-size:11px;letter-spacing:.4px;text-transform:none;color:#fff;background:var(--vino);
  border-radius:3px;padding:5px 9px;line-height:1.4}

/* ══════════════ THE A4 PAGE ══════════════ */
.sheet{
  width:210mm;min-height:297mm;background:var(--paper);color:var(--ink);
  /* 7mm at the foot, not 8. Written out full, the page came to 297.37mm — a third of
     a millimetre past the paper, all of it empty padding, which Chrome still pays for
     with a second almost-blank sheet in every binder. Measured, not guessed. */
  padding:10mm 12mm 7mm;display:flex;flex-direction:column;gap:3.8mm;
  box-shadow:0 3mm 12mm rgba(43,1,4,.28);position:relative
}
/* the running head: where this page lives in the book */
.rh{display:flex;align-items:baseline;gap:4mm;border-bottom:.4mm solid var(--vino);padding-bottom:2mm}
.rh .code{font-size:8pt;letter-spacing:2.6px;font-weight:700;color:var(--oro)}
.rh .cat{font-size:8pt;letter-spacing:2.6px;text-transform:uppercase;font-weight:600;color:var(--vino-light)}
.rh .house{margin-left:auto;font-family:var(--serif);font-size:9pt;font-style:italic;color:var(--vino-light)}

/* photograph — the pitch, before a single word */
/* `cover` filled the band edge to edge and threw away whatever did not fit — and what
   did not fit was the dish. A phone photo is tall, this band is wide, so a plate came
   out as a strip with its near and far rims cut off: the one thing the page exists to
   show, gone. `contain` fits the whole photograph inside the band instead.

   The band itself then went, on 4 August. It existed to be something for a photograph
   not the shape of the band to sit against, and it was doing that job with a slab of
   deep vino either side of the plate. The house library settled it: all 41 dishes are
   shot three-quarter on pure white, and the vessels are not plates — they are oval
   platters, wooden boards, a marble tray, a scalloped bowl. Nothing that can be cropped
   to a shape. So the photograph is simply laid on the paper: `multiply` makes its white
   ground take the colour underneath it, and the mask feathers the outer edge away, so
   the dish sits on the sheet with no band, no frame and no fill. Whatever is left over
   either side of a photograph is now paper, which needs no explaining.

   The height stays fixed because the page is still exactly one A4 and the sheet has to
   be able to say when the writing has outgrown it. 82mm, not 58: with nothing dark to
   fill, the picture can be the size it deserves and still leave the writing its room.

   In print this needs nothing. The sheet is white paper, so the photograph merges with
   no trick at all — the blend is only doing work on screen. */
.shot{position:relative;height:82mm;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
/* sized to the picture, not to the band — the mask has to feather the edge of the
   photograph, and an element wider than its own picture would feather empty paper */
/* 82mm and not 100%: a percentage max-height is resolved against the flex container, and
   in print layout that container height does not resolve, so the constraint disappeared
   and a portrait photograph laid itself out at its intrinsic 1200px — 317mm of it, onto
   a second sheet. An absolute length always resolves. Found by printing, not by reading. */
.shot img{max-width:100%;max-height:82mm;width:auto;height:auto;mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%);
  mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%)}
/* no photograph yet is the one case that still wants the dark band: it is a hole in the
   page and it should look like one, rather than like paper somebody forgot to fill */
.shot.empty{height:58mm;overflow:hidden;background:var(--vino-deep)}
.shot .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;
  color:rgba(245,237,224,.62);text-align:center;padding:6mm}
.shot .none b{font-family:var(--serif);font-weight:400;font-size:14pt;color:rgba(245,237,224,.8)}
.shot .none span{font-size:7.5pt;letter-spacing:2.4px;text-transform:uppercase}
/* on paper, not on a dark band — cream lettering on cream paper is no lettering */
.shot .cred{position:absolute;right:2.5mm;bottom:1mm;font-size:6.5pt;letter-spacing:1.6px;text-transform:uppercase;
  color:#a3907a}
.shot.empty .cred{bottom:2mm;color:rgba(245,237,224,.8);text-shadow:0 0 3mm rgba(43,1,4,.9)}

/* The photograph and the name are one block, side by side: the dish on the left, what it
   is called on the right, reading across the way you would look at it on the pass. The
   photograph stacked above the name instead for a few hours on 4 August, which put the
   name a third of the way down the sheet and left the top of the page saying nothing. */
.hero{display:grid;grid-template-columns:94mm 1fr;gap:7mm;align-items:center;flex:0 0 auto}
/* the name, and the menu line exactly as a guest reads it */
.title{display:flex;flex-direction:column;gap:1.5mm}
.title h1{font-family:var(--serif);font-weight:400;margin:0;font-size:27pt;line-height:.96;color:var(--vino)}
.title .desc{font-family:var(--serif);font-style:italic;font-size:11.5pt;line-height:1.3;color:var(--ink);max-width:150mm}
/* the diet claim on the name — olive, because it is a different kind of word from an
   allergen: what the dish IS, not what it carries */
.dietb{display:inline-block;vertical-align:middle;font-family:var(--sans);font-size:8pt;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;line-height:1;color:var(--cream);background:var(--oliva);
  border-radius:1mm;padding:1.8mm 2.5mm;margin-left:3mm}

/* the middle: what he says, and what it is.
   It no longer takes the slack — `.breathe` below does. Left to grow, the middle pushed
   the service note down onto the allergen rule, and a note touching that rule reads as
   part of it. */
.mid{display:grid;grid-template-columns:1fr 62mm;gap:6mm;flex:0 0 auto;align-items:start}
.story{margin-top:4mm}
.lab{font-size:7.5pt;letter-spacing:2.8px;text-transform:uppercase;font-weight:700;color:var(--vino-light);
  display:block;margin-bottom:1.8mm}
.prose{font-family:var(--serif);font-size:10pt;line-height:1.5;max-width:96mm}
.side{border-left:.3mm solid var(--sabbia-dark);padding-left:5mm;display:flex;flex-direction:column;gap:4mm}
.lst{list-style:none;margin:0;padding:0}
.lst li{font-size:9.5pt;line-height:1.35;padding:1.4mm 0;border-bottom:.2mm solid rgba(207,192,173,.7)}
.lst li:last-child{border-bottom:none}
.todo{font-family:var(--serif);font-style:italic;font-size:9.5pt;line-height:1.5;color:#93826c}
/* The garnish is not a third subject alongside the ingredients: it is the last thing
   that goes on before the plate leaves the pass. So it closes the ingredients under a
   hairline rather than starting a new heading of equal weight. */
.side .garnish{margin-top:-1mm;border-top:.25mm solid var(--sabbia-dark);padding-top:3mm}
.side .garnish .lab{color:#a3907a;letter-spacing:2.2px}
/* And a preparation time is not an ingredient at all. It is a service note, so it comes
   out of the column and sits full width at the foot of the writing, where a note goes. */
.note{display:flex;align-items:baseline;gap:4mm;flex:0 0 auto;
  border-top:.3mm solid var(--sabbia-dark);padding-top:2.5mm}
.note .lab{margin-bottom:0;flex:0 0 auto}
.note .val{font-size:9.5pt;line-height:1.35}
.note .todo{display:inline}
/* the white the writing leaves behind, held between the note and the allergens so it
   reads as a margin rather than as a page that ran out */
.breathe{flex:1 1 auto;min-height:4mm}

/* ───── the photograph, added from this page ─────
   Every one of these lives INSIDE .shot, which is a fixed height, and every one is
   absolutely positioned — so none of them adds a millimetre to the sheet. That is what
   keeps the one-dish-one-A4 promise safe while the page grew a way to write. */
.shot.can{cursor:pointer}
/* tapping the photograph opens it big (Francesco, 29 Sep 2026) - the frame used to
   mean "change it", which put a chef-code box in front of a waiter who only wanted
   to see the plate. Changing it is the Change button now. */
.shot img{cursor:zoom-in}
.fbzoom{position:fixed;inset:0;z-index:100030;background:rgba(20,3,5,.97);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  box-sizing:border-box;cursor:zoom-out}
.fbzoom img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:4px;
  background:#fff}
.fbzoom .zn{font-family:var(--serif);font-size:22px;color:#fbf3e9;text-align:center}
.fbzoom .zx{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:24px;
  border:1px solid rgba(245,237,224,.5);background:rgba(43,1,4,.7);color:#fbf3e9;font-size:22px;
  line-height:1;cursor:pointer}
@media print{.fbzoom{display:none!important}}
.phl{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;gap:2mm;padding:2.5mm 3mm;
  font-family:var(--sans);font-size:8pt;line-height:1.4;text-align:center}
/* on a photograph the strip has to be readable against whatever the photograph is;
   on the empty maroon frame it must not draw a second box inside the first */
.shot:not(.empty) .phl{background:linear-gradient(to top,rgba(43,1,4,.82),rgba(43,1,4,0));color:var(--cream)}
.shot.empty .phl{color:rgba(245,237,224,.9)}
/* the plain invitation stays out of the way until the frame is touched — a waiter
   reading an allergen list is not being sold a button */
.phl.tap{opacity:.32;transition:opacity .15s}
.shot:hover .phl.tap,.shot:focus-within .phl.tap{opacity:1}
.phl.ask,.phl.bad{top:0;background:rgba(43,1,4,.93);color:var(--cream);flex-direction:column;justify-content:center}
.phl.busy{top:0;background:rgba(43,1,4,.86);color:var(--cream);justify-content:center}
/* ⚠ The three rules above never reached a dish that HAS a photograph. `.shot:not(.empty)
   .phl` above them carries three classes to their two, so the thin bottom gradient won
   and every full-frame panel — the "Where does this one go?" question, "Putting it on the
   recipe…", "Not saved." — was drawn straight over the picture with nothing behind the
   words. Measured on the live page 22 Sep 2026: background-color came back
   rgba(0,0,0,0) with the gradient still in place. Found while adding Remove, whose
   question sits in the same panel. Same colours, enough specificity to actually land. */
.shot:not(.empty) .phl.ask,.shot:not(.empty) .phl.bad{
  background-image:none;background-color:rgba(43,1,4,.93)}
.shot:not(.empty) .phl.busy{background-image:none;background-color:rgba(43,1,4,.86)}
.phl b{font-family:var(--serif);font-weight:400;font-size:13pt;display:block;width:100%}
.phn{display:block;width:100%;font-size:7pt;opacity:.75;letter-spacing:.3px}
/* 44px on every one of them: this is used on a phone, standing up, with wet hands */
.phb{font-family:var(--sans);font-size:8.5pt;letter-spacing:.4px;min-height:44px;padding:0 4mm;
  border:.3mm solid var(--cream);border-radius:1.5mm;background:none;color:var(--cream);cursor:pointer}
.phb:hover{background:var(--cream);color:var(--vino-deep)}
.phb.ghost{border-color:rgba(245,237,224,.45);opacity:.8}
/* The resting strip sits over whatever the photograph happens to be, and a cream word
   on a white plate is not a word — the gradient only darkens the very bottom of the
   frame, and these buttons are above it. So each one carries its own dark plate and
   reads on every picture. Added 22 Sep 2026 with Remove, which put a second word up
   there and made the old barely-there treatment a real problem rather than a quiet one. */
.phl.tap .phb{background:rgba(43,1,4,.88)}
.phl.tap .phb.ghost{opacity:1;border-color:rgba(245,237,224,.55)}
.phl.tap .phb:hover{background:var(--cream);color:var(--vino-deep)}
.phb .smw{display:none}
@media (max-width:900px){
  /* on a phone there is no hover to reveal anything, so it is simply always there */
  .phl.tap{opacity:1}
  .phl{font-size:12px}
  .phb{font-size:13px;padding:0 14px}
  /* the short label, so Change and Remove stay on one row over the picture */
  .phb .lgw{display:none}
  .phb .smw{display:inline}
  .phl b{font-size:16px}
  .phn{font-size:11px}
}

/* the two strips that must never be hunted for */
.strips{display:flex;flex-direction:column;gap:3.5mm;flex:0 0 auto}
.strip{border-top:.4mm solid var(--vino);padding-top:2.5mm}
.chips{display:flex;flex-wrap:wrap;gap:1.5mm}
.chip{font-size:8.5pt;line-height:1;padding:2mm 3mm;border:.25mm solid var(--sabbia-dark);border-radius:1mm;
  color:#93826c;background:none}
.chip.hit{background:var(--vino);border-color:var(--vino);color:var(--cream);font-weight:700}
.cut .c{font-size:8.5pt;line-height:1;padding:2mm 3mm;border:.25mm solid var(--sabbia-dark);border-radius:1mm;color:#93826c}
.cut .c.set{border-color:var(--oliva);background:var(--oliva);color:var(--cream);font-weight:600}
.unknown{font-family:var(--serif);font-style:italic;font-size:10pt;line-height:1.45;color:var(--vino);
  border-left:1mm solid var(--vino);padding-left:3mm}
.foot{display:flex;align-items:baseline;gap:3mm;font-size:7pt;letter-spacing:1.8px;text-transform:uppercase;
  color:#a3907a;border-top:.2mm solid var(--sabbia-dark);padding-top:2mm;flex:0 0 auto}
.foot .r{margin-left:auto}
.sample{font-size:6.5pt;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--oro);
  border:.25mm solid var(--oro);border-radius:.8mm;padding:.8mm 1.6mm;margin-left:2mm;white-space:nowrap}

/* ══ small screens: the same page, same order, reflowed so it stays readable.
      An A4 squeezed onto a phone is 4pt type, which is not a page anybody can
      use — so below 900px it becomes one column at reading size.

      `screen and`, not bare `max-width` — A4 is 794px wide at 96dpi, which is under this
      breakpoint, so every rule in here was also matching when the page printed. The
      printer was being handed the phone: one column, 20px gaps, reading-size type. It
      happened to fit on one sheet before; with a photograph worth looking at it came to
      302mm and went out on two. Paper gets the A4 layout, which is the one the whole
      sheet is measured in millimetres for. ══ */
@media screen and (max-width:900px){
  .desk{padding:0 0 50px}
  .front{padding:28px 12px 0}
  .onpaper{padding:14px 10px 16px;margin-top:16px}
  /* on a phone the search and the picker take a line each, and the walk shares one */
  .walk{margin-left:0;width:100%}

var FB_MONTH = /^(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{4}$/i;
function nameKey(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function menuOrder(pool){
  var pick = MENUROWS.filter(function(m){ return m.id === menuPick; })[0];
  if (!pick) return pool;
  var root = pick.parent_id ? (MENUROWS.filter(function(m){ return m.id === pick.parent_id; })[0] || pick) : pick;
  /* a section inside the menu is a group of its own on the menu itself (a month is not —
     its dishes are only on the month) */
  var secKids = pick === root
    ? MENUROWS.filter(function(m){ return m.parent_id === root.id && !FB_MONTH.test(String(m.name).trim()); })
    : [];
  var fold = Array.isArray(pick.fold_order) && pick.fold_order.length ? pick.fold_order
           : Array.isArray(root.fold_order) ? root.fold_order : [];
  var at = {}; fold.forEach(function(k, i){ if (at[k] == null) at[k] = i; });
  var card = PRINTED.filter(function(r){ return r.menu_id === pick.id || r.menu_id === root.id; });
  var byRec = {}, byName = {};
  card.forEach(function(r){
    if (r.recipe_id && byRec[r.recipe_id] == null) byRec[r.recipe_id] = +r.position || 0;
    var k = nameKey(r.name);
    if (k && !r.recipe_id) (byName[k] = byName[k] || []).push(+r.position || 0);
  });
  var seen = {};
  pool.forEach(function(i){ var k = nameKey(DISHES[i].name); seen[k] = (seen[k] || 0) + 1; });
  var rows = pool.map(function(i, n){
    var d = DISHES[i], sec = d.cat || '';
    var kid = secKids.filter(function(k){ return (d.menus || []).indexOf(k.id) >= 0; })[0];
    var key = kid ? 'm:' + kid.id : 's:' + sec;
    var g = at[key] != null ? at[key]
          : 1e6 + (kid ? 1000 + secKids.indexOf(kid)
                       : (FB_SECTIONS.indexOf(sec) < 0 ? 900 : FB_SECTIONS.indexOf(sec)));
    var nk = nameKey(d.name), p = byRec[d.id];
    if (p == null && seen[nk] === 1 && byName[nk] && byName[nk].length === 1) p = byName[nk][0];
    return { i:i, g:g, gn:kid ? kid.name : sec, p:(p == null ? 1e9 : p), nm:d.name || '', n:n };
  });
  rows.sort(function(a, b){
    return (a.g - b.g) || a.gn.localeCompare(b.gn) || (a.p - b.p) ||
           a.nm.localeCompare(b.nm) || (a.n - b.n);
  });
  return rows.map(function(r){ return r.i; });
}


function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ── finding one dish before service ──
   Same rule as the create screen and the recipe card, on purpose. A waiter carrying
   a plate types whichever name is in his head — branzino or seabass, rocket or
   rucola — and both have to land on the same page. */
/* Every pair works BOTH ways round, and it is the same table on all three screens —
   what finds a dish on the create screen finds it here and on the recipe card. */
var SYN = { branzino:['seabass'], seabass:['branzino'], ricciola:['amberjack','hamachi'],
  amberjack:['ricciola','hamachi'], hamachi:['ricciola','amberjack'],
  aubergine:['eggplant'], eggplant:['aubergine'], courgette:['zucchini'], zucchini:['courgette'],
  prawn:['shrimp','gambero','gamberi'], shrimp:['prawn','gambero','gamberi'],
  gambero:['prawn','shrimp'], gamberi:['prawn','shrimp'],
  rocket:['rucola','arugula'], rucola:['rocket','arugula'], arugula:['rocket','rucola'],
  coriander:['cilantro'], cilantro:['coriander'], chilli:['chili'], chili:['chilli'],
  manzo:['beef'], beef:['manzo'], vitello:['veal'], veal:['vitello'],
  tonno:['tuna'], tuna:['tonno'], polpo:['octopus'], octopus:['polpo'],
  patate:['potato'], potato:['patate'], funghi:['mushroom'], mushroom:['funghi'],
  pollo:['chicken'], polletto:['chicken'], chicken:['pollo','polletto'],
  agnello:['lamb'], lamb:['agnello'], limone:['lemon'], lemon:['limone'],
  pomodoro:['tomato'], pomodori:['tomato'], tomato:['pomodoro','pomodori'],
  formaggio:['cheese'], cheese:['formaggio'] };
var STOP = { of:1, the:1, and:1, a:1, al:1, alla:1, con:1, di:1, e:1, '':1 };
function words(s){
  return String(s).toLowerCase().replace(/\bsea\s+bass\b/g,'seabass')
    .replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){ return w && !STOP[w]; });
}
function stem(w){ return w.length>3 ? w.replace(/ies$/,'y').replace(/(es|s)$/,'') : w; }
function same(n,a){ var sn=stem(n), sa=stem(a); return sn.indexOf(sa)===0 || (sa.indexOf(sn)===0 && sn.length>3); }
function hitAt(nw,w){
  var alts = [w].concat(SYN[w]||[]);
  for (var i=0;i<nw.length;i++) for (var j=0;j<alts.length;j++) if (same(nw[i],alts[j])) return i;
  return -1;
}
function posIn(qw, txt){
  var nw = words(txt||''), pos = [];
  for (var i=0;i<qw.length;i++){ var p = hitAt(nw, qw[i]); if (p<0) return null; pos.push(p); }
  return Math.min.apply(null,pos);
}
/* returns positions into DISHES, so picking one is still just an index and every
   existing thing that walks the book keeps working */
/* the dishes on the menu that is picked. Everything else on this page — the walk,
   the picker, the count, the search — works inside this and nothing else, because a
   waiter told to learn the à la carte should not be able to arrive at a Christmas
   dish by pressing next enough times. */
function inMenu(){
  var all = DISHES.map(function(_,i){ return i; });
  if (!menuPick) return all;
  return menuOrder(all.filter(function(i){ return onPick(DISHES[i]); }));
}
function findDishes(qRaw){
  var pool = inMenu();
  var qw = words(qRaw);
  if (!qw.length) return pool;
  var hits = [];
  pool.forEach(function(ix){
    var x = DISHES[ix];
    var f = posIn(qw, x.name), rank;
    if (f != null) rank = f;
    else {
      var g = posIn(qw, x.section);
      if (g != null) rank = 1000 + g;
      else {
        /* "vegan" typed before service is a real question this book can answer. A
           vegan dish answers "vegetarian" too — the stronger claim contains the
           weaker one — and behind every named dish, so the list reads as dishes
           first, then the ones that qualify. */
        var h = posIn(qw, x.diet === 'vegan' ? 'vegan vegetarian'
                        : x.diet === 'vegetarian' ? 'vegetarian' : '');
        if (h == null) return; rank = 2000 + h;
      }
    }
    hits.push({ ix:ix, rank:rank, at:hits.length });
  });
  hits.sort(function(a,b){ return (a.rank-b.rank) || (a.at-b.at); });
  return hits.map(function(h){ return h.ix; });
}
/* it is not on this menu — but is it in the book at all, and where? */
function elsewhereNote(q){
  var qw = words(q); if (!qw.length) return '';
  var found = [];
  DISHES.forEach(function(d){
    if (posIn(qw, d.name) == null) return;
    var names = (d.menus||[]).map(function(id){
      var m = MENUS.filter(function(x){ return x.id===id; })[0]; return m ? m.name : null;
    }).filter(Boolean);
    found.push({ name:d.name, on:names });
  });
  if (!found.length) return '';
  return '<div class="mnote noprint">' + found.slice(0,4).map(function(f){
    return '<b>' + esc(f.name) + '</b> is not on this menu — ' +
      (f.on.length ? 'it is on ' + esc(f.on.join(' and ')) + '.'
                   : 'it is on no menu at all yet.');
  }).join('<br>') + '</div>';
}
/* stepping through the book stays inside the menu */
function step(by){
  if (mode === 'wine'){ wineStep(by); return; }
  var pool = inMenu(); if (!pool.length) return;
  var at = pool.indexOf(idx);
  if (at < 0){ idx = pool[0]; return; }
  idx = pool[(at + by + pool.length) % pool.length];
}

/* ── everything the frame says about photographs ──
   One layer, absolutely positioned inside a frame of fixed height, and gone from print.
   It carries four states and never more than one at a time: the invitation, the work,
   the question when there is already a picture, and what went wrong. */
function photoLayer(d){ return ''; }

/* a date a waiter can read, not an ISO string */
function when(iso){
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{ day:'numeric', month:'short', year:'numeric' }) +
         ', ' + d.toLocaleTimeString(undefined,{ hour:'2-digit', minute:'2-digit' });
}

/* ── the page notices when the recipe moves underneath it ──
   A dish can be re-written by the chef while this page is open on the pass, or while
   the printed copy of it is in somebody's pocket. Nothing used to say so: the sheet
   and the recipe just quietly stopped agreeing.

   It does NOT swap the page under you. Somebody halfway through reading an allergen
   list should not have it change mid-sentence — it says so and waits to be told. */
var WATCH_MS = 90000, changed = null, watching = null;
/* ── the walk notices a dish that was not there when the page opened ──
   Same fault as the recipe card: the list was read once, when the frame was first
   built, and the module keeps the frame alive all session — a dish written after that
   was not in the walk or the picker until the whole app reloaded. A light probe every
   WATCH_MS and on every reopen; the full re-read only when a dish appeared, went, or
   moved. The dish being read is NEVER swapped under the reader: if it moved too, the
   old page stays and the banner says so, exactly as tick() does. */
var freshening = false, dishSig = '';
function listSig(rows){
  return (rows||[]).map(function(r){ return r.id + '@' + (r.updated_at||''); }).sort().join('|');
}
function stampOf(rows, id){
  var r = (rows||[]).filter(function(x){ return x.id === id; })[0];
  return r && r.updated_at;
}
function freshen(){
  if (busy || freshening || document.hidden || PH_STATE) return;
  freshening = true;
  sb('recipes?kind=eq.main&archived=is.false&select=id,updated_at')
    .then(function(rows){
      if (listSig(rows) === dishSig) return;
      var el = document.activeElement;
      if (el && /^(INPUT|TEXTAREA)$/.test(el.tagName)) return;      /* mid-search: the next probe */
      var cur = DISHES[idx], keep = cur && cur.id, keepAt = cur && cur.at;
      return load().then(function(){
        var at = -1;
        DISHES.forEach(function(x,i){ if (x.id === keep) at = i; });
        if (at > -1){
          idx = at;
          if (cur && !cur.isSample && DISHES[at].at !== keepAt){
            DISHES[at] = cur;
            changed = changed || stampOf(rows, keep) || DISHES[at].at;
          }
        } else idx = Math.min(idx, DISHES.length - 1);
        render();
      });
    })
    .catch(function(){})
    .then(function(){ freshening = false; });
}
window.__rcpFreshen = freshen;           /* the module pokes this when the screen is reopened */
function tick(){
  freshen();
  var d = DISHES[idx];
  if (!d || !d.id || d.isSample || document.hidden || changed) return;
  sb('recipes?id=eq.'+d.id+'&select=updated_at')
    .then(function(rows){
      var at = rows && rows[0] && rows[0].updated_at;
      if (!at || !d.at || at === d.at || changed) return;
      changed = at; render();
    })
    .catch(function(){});                   /* a page that shouts about a dropped poll is worse than one that waits */
}
function watch(){
  if (watching) clearInterval(watching);
  watching = setInterval(tick, WATCH_MS);
}
/* Coming back to the page is the moment before he carries the plate. A phone locked
   in an apron pocket stops the timer; waiting out another interval after he looks
   again is exactly the window in which he tells a guest the old allergens. */
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });
function mark(on){ return on ? '<span class="sample">Sample</span>' : ''; }
function sm(d,k){ return !!(d.sample && (d.sample.all || d.sample[k])); }
function todo(t){ return '<div class="todo">'+esc(t)+'</div>'; }

function sheet(d){
  /* A real dish carries its own photograph, taken on the create screen and stored
     with the recipe. The written-out sample still borrows a venue picture, because
     no dish has been photographed yet — and it says SAMPLE on the page so nobody
     mistakes the crudo counter for the plate. */
  var img = !d.photo ? null
          : (/^data:/.test(d.photo) ? d.photo : PH[d.photo] || null);
  return '<div class="sheet">' +

    '<div class="rh">' +
      '<span class="cat">'+esc(d.cat)+'</span>' +
      '<span class="house">Roberto’s DIFC &nbsp;·&nbsp; Food Bible 2026</span>' +
    '</div>' +

    '<div class="hero">' +
      /* The frame is the control. Not the written-out sample — it borrows a venue
         picture and belongs to no recipe, so there is nothing to put a photograph on. */
      '<div class="shot'+(img ? '' : ' empty')+(d.isSample ? '' : ' can')+'"' +
          (d.isSample ? '' : ' data-shot="'+esc(d.id)+'"')+'>' +
        (img ? '<img src="'+img+'" alt="'+esc(d.name)+'"><span class="cred">'+esc(d.cred||'')+'</span>'
             /* unchanged, and deliberately: this line is printed, and "tap to add the
                photo" on a piece of paper is an instruction nobody can follow */
             : (d.photoWait ? '<div class="none"><b>Loading the photograph…</b></div>'
               : d.photoFail ? '<div class="none"><b>The photograph could not be loaded</b><span>the rest of the page is correct</span></div>'
               : '<div class="none"><b>No photograph yet</b><span>the dish photo goes here</span></div>')) +
        /* Absolutely positioned, and gone from the printed page — so it costs the sheet
           no height and cannot push the allergens onto a second piece of paper. */
        (d.isSample ? '' : photoLayer(d)) +
      '</div>' +

      /* the diet claim sits on the name, not in the allergen strip — a waiter asked
         "is anything vegan" reads names, and the strip below is for what a dish
         CARRIES, not what it is free of */
      '<div class="title"><h1>'+esc(d.name) +
        (d.diet ? '<span class="dietb">'+(d.diet==='vegan'?'Vegan':'Vegetarian')+'</span>' : '') + '</h1>' +
        (d.desc ? '<div class="desc">'+esc(d.desc)+'</div>'
                : '<div class="desc" style="color:#93826c">The menu line is not written yet.</div>') +
      '</div>' +
    '</div>' +

    '<div class="mid">' +
      '<div>' +
        '<div class="story" style="margin-top:0"><span class="lab">The story</span>' +
          (d.story ? '<div class="prose">'+esc(d.story)+'</div>'
                   : todo('Where it comes from, why it is on the menu, what makes it ours. Not written yet.')) +
        '</div>' +
      '</div>' +
      '<div class="side">' +
        '<div><span class="lab">Ingredients'+mark(sm(d,'ing'))+'</span>' +
          (d.ing.length ? '<ul class="lst">'+d.ing.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
                        : todo('Not written yet.')) + '</div>' +
        '<div class="garnish"><span class="lab">Garnish</span>' +
          (d.garnish.length ? '<ul class="lst">'+d.garnish.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'
                            : todo('Not written yet.')) + '</div>' +
      '</div>' +
    '</div>' +

    /* the service note, full width at the foot of the writing rather than a third
       heading in a column of ingredients */
    '<div class="note"><span class="lab">More information</span>' +
      (d.more ? '<span class="val">'+esc(d.more)+'</span>'
              : todo('Not written yet.')) +
    '</div>' +

    '<div class="breathe"></div>' +

    '<div class="strips">' +
      /* An untouched allergen row and a genuinely allergen-free dish look identical,
         and this is the one field on the page that can hurt somebody. So when
         nothing has been ticked the page refuses to imply an answer: the chips go,
         and it says plainly that it does not know yet. */
      '<div class="strip"><span class="lab">Allergens'+mark(sm(d,'allergens'))+'</span>' +
        (d.allergens.length
          /* Only what the chef ticked. It used to print all fourteen and fill in the
             ones that applied, so a dish with two allergens carried twelve words the
             floor had to read past to find them. What is on the page is what is in
             the dish. */
          ? '<div class="chips">' + ALLERGENS.filter(function(a){
              return d.allergens.indexOf(a.k) >= 0; }).map(function(a){
              return '<span class="chip hit">'+esc(a.t)+'</span>'; }).join('') + '</div>'
          : '<div class="unknown">Not ticked yet — this page cannot answer an allergy question. ' +
            'Ask the kitchen before you serve it.</div>') + '</div>' +
      /* Only what the chef ticked, same as the allergens above. Nine pieces of cutlery
         printed so the three that matter can be picked out is a table laid wrong by a
         waiter reading in a hurry. And nothing ticked is not "set nothing" — it is a
         question nobody has answered, so the page says which of the two it is. */
      '<div class="strip"><span class="lab">Mise en place — what to set'+mark(sm(d,'cutlery'))+'</span>' +
        (d.cutlery.length
          ? '<div class="chips cut">' + CUTLERY.filter(function(c){
              return d.cutlery.indexOf(c) >= 0; }).map(function(c){
              return '<span class="c set">'+esc(c)+'</span>'; }).join('') + '</div>'
          : '<div class="unknown">Not ticked yet — ask the kitchen what this dish is eaten with.</div>'
        ) + '</div>' +
    '</div>' +

    /* A printed sheet has no way of knowing the recipe moved on without it. Stamping
       the moment it was written is what makes two pieces of paper comparable, and it
       is the only part of this that survives the printer. */
    '<div class="foot"><span>' +
      /* The legend has to describe what is actually printed. It said "filled in = the
         dish contains it" back when all fourteen were on the page; now that only the
         ticked ones are, a legend about filling-in is describing a page that no longer
         exists. */
      (d.allergens.length ? 'Everything listed is in the dish' : 'No allergens ticked on this recipe yet') +
      '</span>' +
      (d.at ? '<span>Recipe last changed ' + esc(when(d.at)) + '</span>' : '') +
      '<span class="r">Ticked by the chef on the recipe — never guessed</span></div>' +
  '</div>';
}

/* the heading every Recipes screen opens with - the room behind it, the panel under it */
function frame(inner){
  return '<div class="desk"><div class="front">' +
    '<div class="noprint"><div class="eyebrow">Roberto’s DIFC &nbsp;·&nbsp; Food &amp; Beverage</div>' +
    '<h1 class="lede">Food &amp; Beverage Bible</h1>' +
      /* Food | Wine — the same door, the same walk, the same search */
      '<div class="fbmode" role="tablist" aria-label="Food or wine">' +
        '<button role="tab" id="mfood" class="'+(mode==='food'?'on':'')+'" aria-selected="'+(mode==='food')+'">Food</button>' +
        '<button role="tab" id="mwine" class="'+(mode==='wine'?'on':'')+'" aria-selected="'+(mode==='wine')+'">Wine by the glass</button>' +
      '</div></div>' +
    inner +
  '</div></div>';
}
function render(){
  var root = document.getElementById('root');
  if (busy){
    root.innerHTML = frame('<div class="onpaper noprint"><div class="fbstat">Reading the recipes…</div></div>');
    return;
  }
  if (mode === 'wine') return renderWine();
  if (idx >= DISHES.length) idx = 0;
  /* switching menu can leave you standing on a dish that is not on it */
  var pool = inMenu();
  if (pool.length && pool.indexOf(idx) < 0) idx = pool[0];
  var d = DISHES[idx];
  var hits = findDishes(bq);
  var walk = pool.length > 1;
  root.innerHTML = frame(
    '<div class="onpaper">' +
      '<div class="fbctl noprint">' +
      (MENUS.length && menuPick && !pool.length
        ? '<div class="mnote"><b>Nothing is on this menu yet.</b> The chef puts a dish on it ' +
          'from the create screen, and it appears here. Pick <b>Everything</b> in the menu list to see the whole book.</div>'
        : '') +
      /* "nothing matches" while the dish is sitting on the next menu along is a
         half-truth, and it sends a waiter looking for a page he was told is not
         there. Say where it actually is. */
      (bq && !hits.length && menuPick ? elsewhereNote(bq) : '') +
      '<div class="tools">' +
        /* by name, because before service a waiter is looking up one dish he is about
           to carry, not walking the whole book. At three hundred dishes the dropdown
           on a phone is a scroll wheel a mile long, so you type first and the list
           narrows to what you typed — Enter opens the top one. */
        '<span class="pickwrap">' +
          (MENUS.length
            ? '<select id="mpick" aria-label="Which menu">' +
                MENUS.map(function(m){
                  return '<option value="'+esc(m.id)+'"'+(menuPick===m.id?' selected':'')+'>'+esc(m.name)+
                    (m.running?' \u2014 now':'')+'</option>'; }).join('') +
                '<option value=""'+(menuPick===''?' selected':'')+'>Everything \u2014 the whole book</option>' +
              '</select>'
            : '') +
          '<input id="bq" value="'+esc(bq)+'" aria-label="Search dishes" ' +
            'placeholder="type a dish — burrata, branzino…">' +
          '<select id="pick" aria-label="Which dish"'+(hits.length?'':' disabled')+'>' +
            (hits.length
              ? hits.map(function(i){
                  /* the menu really does carry two dishes called Branzino — one raw in
                     Crudo, one whole in salt. Two identical lines in a picker is a
                     waiter opening the wrong page, so a repeated name says where it is. */
                  var twice = hits.filter(function(j){ return DISHES[j].name === DISHES[i].name; }).length > 1;
                  return '<option value="'+i+'"'+(i===idx?' selected':'')+'>'+esc(DISHES[i].name) +
                    (twice && DISHES[i].cat ? ' · ' + esc(DISHES[i].cat) : '') + '</option>'; }).join('')
              : '<option>nothing matches</option>') +
          '</select>' +
          (bq ? '<button class="btn ghost" id="bclr">Clear</button>' : '') +
        '</span>' +
        /* back and forward are the two arrows either side of the page, below */
        '<span class="walk">' +
          '<button class="btn" id="print">Print this page</button>' +
        '</span>' +
      '</div>' +
      '<div class="fbstat">' +
        '<span>' +
          (loadErr ? 'Could not read the recipes — ' + esc(loadErr)
                   : (bq ? hits.length + ' of ' + pool.length + ' match'
                         : 'Dish ' + (Math.max(0, pool.indexOf(idx)) + 1) + ' of ' + pool.length) +
                     (menuPick ? ' on ' + esc((MENUS.filter(function(m){ return m.id===menuPick; })[0]||{}).name || 'this menu') : '') +
                     ' &nbsp;·&nbsp; one dish, one A4' +
                     (d.isSample ? ' &nbsp;·&nbsp; a finished page, written by me' : '') +
                     (frozen && SNAP ? ' &nbsp;·&nbsp; <b class="stale">as the recipes stood ' + esc(stamp()) + '</b>' : '')) +
        '</span>' +
        '<span id="fit"></span>' +
      '</div>' +
      '</div>' +
      '<div class="fbpage'+(walk?' walking':'')+'">' +
      (walk
        ? '<div class="fbrail l noprint"><button class="fbarrow" id="prev" aria-label="Previous dish" title="Previous dish">&larr;</button></div>' +
          '<div class="fbrail r noprint"><button class="fbarrow" id="next" aria-label="Next dish" title="Next dish">&rarr;</button></div>'
        : '') +
      (changed
        ? '<div class="moved noprint"><b>' + esc(d.name) + ' has been re-written in the kitchen</b> — ' +
          esc(when(changed)) + '. This page, and anything printed from it, is the older one. ' +
          '<button class="btn" id="reload">Show the new one</button></div>'
        : '') +
      glassBar(d) +
      sheet(d) +
      '</div>' +
    '</div>');
  checkOneSheet();
  warmPhotos();
}

/* ═══════════════════════════════════════════════════════════════════════════
   WINE BY THE GLASS — the second half of the Food & Beverage Bible (8 Oct 2026).
   Same page, same door, same walk and search, so the floor learns one screen.
   The wines and the pairings are rows in fb_wines / fb_wine_pairings (Kitchen
   database, read only from here). A pairing is keyed on the RECIPE ID: a renamed
   dish keeps its glass, and a dish taken off every menu drops out of the wine's
   list on its own. Nothing about a wine is written in this file.
   ═══════════════════════════════════════════════════════════════════════════ */
var mode = 'food', WINES = [], WPAIR = {}, WDISH = {}, wineErr = null;
var widx = 0, wq = '', wstyle = '';
var WSTYLE = { sparkling:'Sparkling', white:'White', rose:'Rosé', red:'Red' };
function wineIx(id){ for (var i = 0; i < WINES.length; i++) if (WINES[i].id === id) return i; return -1; }
function dishIx(id){ for (var i = 0; i < DISHES.length; i++) if (DISHES[i].id === id) return i; return -1; }
function setWines(wines, pairs){
  var keep = WINES[widx] && WINES[widx].id;
  WINES = (wines || []).filter(function(w){ return w && w.id && w.name; });
  WPAIR = {}; WDISH = {};
  (pairs || []).forEach(function(p){
    if (!p || !p.wine_id || !p.recipe_id || wineIx(p.wine_id) < 0) return;
    (WPAIR[p.recipe_id] = WPAIR[p.recipe_id] || []).push(p);
    (WDISH[p.wine_id] = WDISH[p.wine_id] || []).push(p);
  });
  Object.keys(WPAIR).forEach(function(k){
    WPAIR[k].sort(function(a, b){ return (a.rank - b.rank) || (wineIx(a.wine_id) - wineIx(b.wine_id)); });
  });
  var at = keep ? wineIx(keep) : -1;
  widx = at > -1 ? at : Math.min(widx, Math.max(0, WINES.length - 1));
}
function winePool(){
  var out = [];
  WINES.forEach(function(w, i){ if (!wstyle || w.style === wstyle) out.push(i); });
  return out;
}
/* "lamb" or "oysters" typed before service lands on the wines that go with it */
function wineText(w){
  return [w.name, w.region, w.grapes, WSTYLE[w.style] || '',
    (WDISH[w.id] || []).map(function(p){ var i = dishIx(p.recipe_id); return i > -1 ? DISHES[i].name : ''; }).join(' ')
  ].join(' ');
}
function findWines(qRaw){
  var pool = winePool(), qw = words(qRaw);
  if (!qw.length) return pool;
  var hits = [];
  pool.forEach(function(i){
    var w = WINES[i], f = posIn(qw, w.name), rank;
    if (f != null) rank = f;
    else { var g = posIn(qw, wineText(w)); if (g == null) return; rank = 1000 + g; }
    hits.push({ i:i, rank:rank, at:hits.length });
  });
  hits.sort(function(a, b){ return (a.rank - b.rank) || (a.at - b.at); });
  return hits.map(function(h){ return h.i; });
}
function wineStep(by){
  var pool = winePool(); if (!pool.length) return;
  var at = pool.indexOf(widx);
  widx = at < 0 ? pool[0] : pool[(at + by + pool.length) % pool.length];
}
/* the dishes a wine goes with — in the order the menu is laid out, never A-Z */
function wineDishes(w, rank){
  return (WDISH[w.id] || []).filter(function(p){ return p.rank === rank; })
    .map(function(p){ return { p:p, i:dishIx(p.recipe_id) }; })
    .filter(function(r){ return r.i > -1; })
    .sort(function(a, b){
      var sa = FB_SECTIONS.indexOf(DISHES[a.i].cat), sb2 = FB_SECTIONS.indexOf(DISHES[b.i].cat);
      return ((sa < 0 ? 99 : sa) - (sb2 < 0 ? 99 : sb2)) || DISHES[a.i].name.localeCompare(DISHES[b.i].name);
    });
}
function wchip(id, alt){
  var w = WINES[wineIx(id)];
  return w ? '<button class="wchip' + (alt ? ' alt' : '') + '" data-w="' + esc(w.id) + '">' + esc(w.name) + '</button>' : '';
}
/* above the dish's A4, never on it: the sheet's one-page promise is measured on the sheet */
function glassBar(d){
  if (!d || d.isSample || !WINES.length) return '';
  var ps = WPAIR[d.id] || [];
  var first = ps.filter(function(p){ return p.rank === 1; }), also = ps.filter(function(p){ return p.rank === 2; });
  if (!first.length){
    /* a dessert with no glass is an answer the floor needs, not a blank */
    return d.cat === 'Dessert'
      ? '<div class="glass noprint"><span class="gl">By the glass</span><span class="none">No wine on the by-the-glass list suits this dessert — ' +
        'every glass is dry, and a dry wine tastes sour next to something sweet.</span></div>'
      : '';
  }
  return '<div class="glass noprint"><span class="gl">By the glass</span>' +
    first.map(function(p){ return wchip(p.wine_id, false); }).join('') +
    (also.length ? '<span class="gl">also</span>' + also.map(function(p){ return wchip(p.wine_id, true); }).join('') : '') +
    (first[0].why ? '<div class="why">' + esc(first[0].why) + '</div>' : '') +
  '</div>';
}
function wineSheet(w){
  var best = wineDishes(w, 1), also = wineDishes(w, 2);
  function list(rows, withWhy){
    return '<ul class="wlist">' + rows.map(function(r){
      var d = DISHES[r.i];
      return '<li><button class="wdish" data-r="' + esc(d.id) + '"><span class="wn">' + esc(d.name) + '</span>' +
        (d.cat ? ' <span class="wc">· ' + esc(d.cat) + '</span>' : '') +
        (withWhy && r.p.why ? '<small>' + esc(r.p.why) + '</small>' : '') + '</button></li>';
    }).join('') + '</ul>';
  }
  return '<div class="sheet">' +
    '<div class="rh">' +
      '<span class="cat">' + esc(WSTYLE[w.style] || '') + ' · by the glass</span>' +
      '<span class="house">Roberto’s DIFC &nbsp;·&nbsp; Wine by the glass 2026</span>' +
    '</div>' +
    '<div class="hero">' +
      '<div class="shot bottle' + (w.photo ? '' : ' empty') + '">' +
        (w.photo ? '<img src="' + esc(w.photo) + '" alt="' + esc(w.name) + '">'
                 : '<div class="none"><b>No photograph yet</b><span>the bottle goes here</span></div>') +
      '</div>' +
      '<div class="title"><h1>' + esc(w.name) + '</h1>' +
        '<div class="desc">' + esc([w.region, w.grapes].filter(Boolean).join(' · ')) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mid">' +
      '<div>' +
        '<div class="story" style="margin-top:0"><span class="lab">In the glass</span>' +
          (w.notes ? '<div class="prose">' + esc(w.notes) + '</div>' : todo('Not written yet.')) + '</div>' +
        '<div class="story"><span class="lab">How to sell it</span>' +
          (w.story ? '<div class="prose">' + esc(w.story) + '</div>' : todo('Not written yet.')) + '</div>' +
      '</div>' +
      '<div class="side">' +
        (best.length
          ? '<div><span class="lab">The best glass for</span>' + list(best, true) + '</div>' +
            (also.length ? '<div class="garnish"><span class="lab">Also good with</span>' + list(also, false) + '</div>' : '')
          : '<div><span class="lab">Good with</span>' +
            (also.length ? list(also, false) : '<div class="todo">No dish on the menu is paired with it yet.</div>') + '</div>') +
      '</div>' +
    '</div>' +
    '<div class="foot"><span>Paired against each dish as the kitchen wrote it</span>' +
      '<span class="r">Tap a dish to open its page</span></div>' +
  '</div>';
}
function renderWine(){
  var root = document.getElementById('root');
  if (!WINES.length){
    root.innerHTML = frame('<div class="onpaper"><div class="fbstat">' +
      (wineErr ? 'Could not read the wine list — ' + esc(wineErr)
               : frozen ? 'The wine list is only shown when the page can read the live list.'
               : 'No wine by the glass is on the list yet.') + '</div></div>');
    return;
  }
  var pool = winePool();
  if (pool.length && pool.indexOf(widx) < 0) widx = pool[0];
  var w = WINES[widx], hits = findWines(wq), walk = pool.length > 1;
  root.innerHTML = frame(
    '<div class="onpaper">' +
      '<div class="fbctl noprint">' +
      '<div class="tools">' +
        '<span class="pickwrap">' +
          '<select id="wstyle" aria-label="Which wines">' +
            '<option value=""' + (wstyle ? '' : ' selected') + '>All wines by the glass</option>' +
            ['sparkling','white','rose','red'].map(function(k){
              return '<option value="' + k + '"' + (wstyle === k ? ' selected' : '') + '>' + WSTYLE[k] + '</option>'; }).join('') +
          '</select>' +
          '<input id="wq" value="' + esc(wq) + '" aria-label="Search wines" ' +
            'placeholder="a wine, a grape or a dish — malbec, lamb…">' +
          '<select id="wpick" aria-label="Which wine"' + (hits.length ? '' : ' disabled') + '>' +
            (hits.length
              ? hits.map(function(i){ return '<option value="' + i + '"' + (i === widx ? ' selected' : '') + '>' + esc(WINES[i].name) + '</option>'; }).join('')
              : '<option>nothing matches</option>') +
          '</select>' +
          (wq ? '<button class="btn ghost" id="wclr">Clear</button>' : '') +
        '</span>' +
        '<span class="walk"><button class="btn" id="print">Print this page</button></span>' +
      '</div>' +
      '<div class="fbstat"><span>' +
        (wq ? hits.length + ' of ' + pool.length + ' match' : 'Wine ' + (Math.max(0, pool.indexOf(widx)) + 1) + ' of ' + pool.length) +
        (wstyle ? ' · ' + esc(WSTYLE[wstyle]) : '') + ' &nbsp;·&nbsp; by the glass' +
      '</span><span id="fit"></span></div>' +
      '</div>' +
      '<div class="fbpage' + (walk ? ' walking' : '') + '">' +
      (walk
        ? '<div class="fbrail l noprint"><button class="fbarrow" id="prev" aria-label="Previous wine" title="Previous wine">&larr;</button></div>' +
          '<div class="fbrail r noprint"><button class="fbarrow" id="next" aria-label="Next wine" title="Next wine">&rarr;</button></div>'
        : '') +
      wineSheet(w) +
      '</div>' +
    '</div>');
  checkOneSheet();
}
/* from a wine to the dish, and back — the pairing is one link, read from both ends */
function openDish(id){
  var i = dishIx(id); if (i < 0) return;
  mode = 'food'; idx = i; bq = ''; changed = null;
  if (menuPick && !onPick(DISHES[i])) menuPick = '';
  render(); window.scrollTo(0, 0);
}
function openWine(id){
  var i = wineIx(id); if (i < 0) return;
  mode = 'wine'; widx = i; wq = '';
  if (wstyle && WINES[i].style !== wstyle) wstyle = '';
  render(); window.scrollTo(0, 0);
}

/* The page promises one dish on one A4 in its own header. Past the word budgets it
   quietly becomes two sheets, and the allergen strip is what lands on the second one
   — so measure the real thing after it is drawn and say so, with what to shorten. */
function checkOneSheet(){
  var sh = document.querySelector('.sheet'), out = document.getElementById('fit');
  if (!sh || !out) return;
  /* Only the A4 layout can be measured against A4. Below 900px the sheet is deliberately
     reflowed to reading size on one column and is metres tall — measuring that against
     297mm says "this runs onto a second sheet, the allergens go with it" about a page
     that prints perfectly well on one. A false alarm here costs somebody cutting real
     writing out of a recipe to fix a problem that was never there, so on a phone the
     page says nothing rather than something untrue. */
  if (window.matchMedia && window.matchMedia('(max-width:900px)').matches){ out.innerHTML = ''; return; }
  var probe = document.createElement('div');
  probe.style.cssText = 'width:100mm;position:absolute;visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  var pxPerMm = probe.getBoundingClientRect().width / 100;
  probe.remove();
  if (!pxPerMm) return;
  var over = Math.round(sh.getBoundingClientRect().height / pxPerMm - 297);
  out.innerHTML = over > 2
    ? '<span class="over">This runs about ' + over + 'mm onto a second sheet — ' +
      'the allergens go with it. Shorten the story or “more information” on the recipe.</span>'
    : '';
}

document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'mpick'){
    menuPick = e.target.value; bq=''; changed=null; render(); window.scrollTo(0,0); return;
  }
  if (e.target && e.target.id === 'wstyle'){ wstyle = e.target.value; wq = ''; render(); window.scrollTo(0,0); return; }
  if (e.target && e.target.id === 'wpick'){ widx = +e.target.value; render(); window.scrollTo(0,0); return; }
  if (e.target && e.target.id === 'pick'){
    idx = +e.target.value; changed = null; render(); window.scrollTo(0,0);
  }
});
/* Typing redraws the toolbar, so the box being typed into is replaced between
   letters — put the caret back or only the first letter arrives. The page itself is
   NOT changed while you type: a waiter looking up Branzino should not watch four
   other dishes flash past on the way. */
document.addEventListener('input', function(e){
  if (!e.target || (e.target.id !== 'bq' && e.target.id !== 'wq')) return;
  var box = e.target.id, at = e.target.selectionStart;
  if (box === 'wq') wq = e.target.value; else bq = e.target.value;
  render();
  var n = document.getElementById(box);
  if (n){ n.focus(); try{ n.setSelectionRange(at,at); }catch(_){} }
});
/* the arrow keys walk the menu too — but never while typing a search or choosing in the list */
document.addEventListener('keydown', function(e){
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || PH_STATE) return;
  var t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if (!document.getElementById('next')) return;
  e.preventDefault();
  step(e.key === 'ArrowRight' ? 1 : -1); changed = null; render(); window.scrollTo(0,0);
});
/* Enter opens the best match — the whole point is not having to reach for the list */
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'wq' && e.key === 'Enter'){
    var wh = findWines(wq); if (!wh.length) return;
    e.preventDefault(); widx = wh[0]; wq = ''; render(); window.scrollTo(0,0); return;
  }
  if (!e.target || e.target.id !== 'bq' || e.key !== 'Enter') return;
  var hits = findDishes(bq);
  if (!hits.length) return;
  e.preventDefault(); idx = hits[0]; bq = ''; changed = null; render(); window.scrollTo(0,0);
});
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  /* the frame itself, not only the button on it — the picture is the obvious thing to
     tap, and on a phone it is a far bigger target than any button drawn over it */
    var zoom = e.target.closest ? e.target.closest('.fbzoom') : null;
  if (zoom){ zoom.remove(); return; }
  var shotEl = e.target.closest ? e.target.closest('.shot') : null;
  var pic = shotEl && shotEl.querySelector('img');
  /* the question and progress panels cover the whole frame - a tap on them is not a
     tap on the picture */
  if (pic && !b && !e.target.closest('.phl:not(.tap)')){
    var z = document.createElement('div');
    z.className = 'fbzoom noprint';
    z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', pic.alt || 'Photograph');
    z.innerHTML = '<button class="zx" aria-label="Close">\u2715</button>' +
      '<img src="' + esc(pic.getAttribute('src')) + '" alt="' + esc(pic.alt) + '">' +
      '<div class="zn">' + esc(pic.alt) + '</div>';
    document.body.appendChild(z);
    return;
  }
  if (!b) return;
  if (b.id==='mfood' || b.id==='mwine'){
    var want = b.id === 'mwine' ? 'wine' : 'food';
    if (want !== mode){ mode = want; changed = null; render(); window.scrollTo(0,0); }
    return;
  }
  if (b.getAttribute('data-w')){ openWine(b.getAttribute('data-w')); return; }
  if (b.getAttribute('data-r')){ openDish(b.getAttribute('data-r')); return; }
  if (b.id==='wclr'){ wq=''; render(); var wc=document.getElementById('wq'); if (wc) wc.focus(); return; }
  if (b.id==='bclr'){ bq=''; render(); var c=document.getElementById('bq'); if (c) c.focus(); return; }
  if (b.id==='reload'){
    var keep = DISHES[idx] && DISHES[idx].id;
    changed = null; busy = true; render();
    load().then(function(){
      var at = -1;
      DISHES.forEach(function(x,i){ if (x.id === keep) at = i; });   /* stay on the dish he was reading */
      if (at > -1) idx = at;
      render(); watch();
    });
    return;
  }
  if (b.id==='print'){ window.print(); return; }
  if (b.id==='next'){ step(1); changed = null; render(); window.scrollTo(0,0); return; }
  if (b.id==='prev'){ step(-1); changed = null; render(); window.scrollTo(0,0); return; }
});
window.addEventListener('resize', function(){ if (!busy) checkOneSheet(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ var z = document.querySelector('.fbzoom'); if (z) z.remove(); }
});

/* ── opened from the Recipes module ──
   `?id=` opens that dish's page. `&embed=1` only tightens the padding now: the walk
   and the picker stay, because the module opens this page without naming a dish. */
var Q = new URLSearchParams(location.search);
var embedded = Q.get('embed') === '1';
if (Q.get('mode') === 'wine') mode = 'wine';
if (embedded) document.documentElement.classList.add('embed');

render();
load().then(function(){
  var want = Q.get('id');
  if (want){
    var i = DISHES.findIndex(function(d){ return d.id === want; });
    if (i > -1) idx = i;
    else { loadErr = 'that dish is not on the menu any more'; }
  }
  render();
  watch();
});
</script>
