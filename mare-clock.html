<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00575F">
<title>Roberto's Mare · Team</title>
<link rel="icon" href="mare-logo-teal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Roberto's Mare — the TEAM app. Two ways in:
     1. The TABLET at the staff entrance (paired once with a tablet code from
        the management app): clock in/out with name + 4-digit code + photo, and
        the team modules (briefing, checklists, rota, recipes, breakage, leave,
        speak up). Any action that is someone's asks for their name + code.
     2. A staff PHONE opening its private link (?me=…) + their code: their own
        hours and shifts, and the same modules. Phones never clock in.
     Database: mare_kiosk_* (clock-in), mare_s_* (modules), mare_me (hours).
     Dubai recipe cards are read-only from the Kitchen app. -->
<style>
:root{
  --teal:#00575F; --teal-2:#016A74; --tint:#DCEBEC; --tint-2:#EEF5F5; --cream:#FAF5F0; --card:#FFFFFF; --line:#E6DCCF; --line-2:#F0E9DF;
  --ink:#1E2A2C; --muted:#4A5658; --soft:#EFE8DF; --red:#9B1C1C; --red-bg:#FDECEC; --amber:#7A4100; --amber-bg:#FFF3E0;
  --blue:#1E3A8A; --blue-bg:#E8EEFC; --green:#1F5E2E; --green-bg:#E5F2E7; --shadow:0 1px 2px rgba(30,42,44,.06),0 6px 22px rgba(30,42,44,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:Karla,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.kiosk{-webkit-user-select:none;user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
.serif,.mod b,.rcard b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.app{min-height:100vh;display:flex;flex-direction:column}
header{color:#fff;position:relative;background:#0f3a3f url('mare-hero.jpg') center 62%/cover no-repeat;flex-shrink:0}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,52,58,.92) 0%,rgba(0,52,58,.72) 55%,rgba(0,52,58,.55) 100%)}
.hin{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,36px);padding-top:max(14px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:60px;height:60px;flex-shrink:0}
.brand .t1{font-size:clamp(22px,2.6vw,32px);letter-spacing:4px;line-height:1}
.brand .t2{font-size:14px;letter-spacing:1px;opacity:.95;margin-top:4px}
.hr{display:flex;align-items:center;gap:16px}
.clock{text-align:right}
.clock .c1{font-size:clamp(30px,4vw,46px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock .c2{font-size:15px;opacity:.95;margin-top:4px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:9px 14px;font-weight:700;font-size:15px;min-height:44px}
.lang button.on{background:#fff;color:var(--teal)}
main{flex:1;padding:20px clamp(16px,3vw,36px) 16px;display:flex;flex-direction:column;gap:18px;min-height:0}
h1{margin:0;font-size:clamp(28px,3.4vw,40px);letter-spacing:2px;color:var(--teal)}
h2{margin:0;font-size:24px;color:var(--teal)}
h3{margin:0;font-size:18px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:110px;box-shadow:0 1px 2px rgba(30,42,44,.04)}
.mod .ic{width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--teal);display:flex;align-items:center;justify-content:center}
.mod b{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1.05}
.mod span.s{font-size:13px;font-weight:700;color:var(--teal);margin-top:auto}
.mod span.s.alert{color:var(--red)}
.mod:active{background:#F4EEE6}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;align-items:start}
.group h2{margin:0 0 10px;font-family:Karla,sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--muted);border-bottom:1px solid #D8CFC4;padding-bottom:8px}
.names{display:flex;flex-direction:column;gap:10px}
.name{min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-size:22px;font-weight:600}
.name:active{background:#F4EEE6}
.pill{font-size:14px;font-weight:700;border-radius:999px;padding:6px 12px;white-space:nowrap}
.pill.in{background:var(--teal);color:#fff} .pill.out{background:var(--soft);color:var(--muted)} .pill.new{background:var(--amber-bg);color:var(--amber)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:14px;color:var(--muted);padding-bottom:max(4px,env(safe-area-inset-bottom))}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#2E7D32;margin-right:6px;vertical-align:middle}
.dot.off{background:var(--red)}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #C9BEB1;border-radius:999px;padding:10px 20px;font-size:18px;min-height:52px;font-weight:600}
.pinwrap{display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start;justify-content:center}
.who{flex:1 1 300px;max-width:460px;display:flex;flex-direction:column;gap:16px}
.who .act{font-size:17px;letter-spacing:2px;color:var(--muted);font-weight:700}
.who .nm{font-size:clamp(46px,6vw,70px);line-height:1;color:var(--teal)}
.cam{width:100%;max-width:340px;aspect-ratio:4/3;border-radius:16px;background:#1E2A2C;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#C9D6D7;font-size:15px;text-align:center;padding:12px}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pad{flex:0 1 420px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pad .lbl{font-size:22px;font-weight:700;text-align:center}
.dots{display:flex;gap:22px;height:28px;align-items:center}
.dots span{width:24px;height:24px;border-radius:50%;border:2px solid var(--teal)}
.dots span.on{background:var(--teal)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.keys button{height:clamp(66px,10vh,90px);border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:34px;font-weight:700}
.keys button.small{font-size:19px}
.keys button:active{background:#E8F0F0}
.msg{min-height:28px;font-size:19px;font-weight:700;text-align:center}
.msg.err{color:var(--red)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.tick{width:150px;height:150px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
.tick.warn{background:var(--amber)}
.done .nm{font-size:clamp(46px,6vw,64px);color:var(--teal);line-height:1}
.done .l1{font-size:clamp(28px,4vw,40px);font-weight:700}
.done .l2{font-size:20px;color:var(--muted);max-width:640px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:19px;font-weight:700;min-height:56px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #C9BEB1}
.btn:disabled{opacity:.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(30,42,44,.04)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px}
.tag.green{background:var(--green-bg);color:var(--green)} .tag.amber{background:var(--amber-bg);color:var(--amber)} .tag.grey{background:var(--soft);color:var(--muted)} .tag.blue{background:var(--blue-bg);color:var(--blue)} .tag.red{background:var(--red-bg);color:var(--red)}
.bf{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.bf .card h3{font-size:14px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.bf .card div{font-size:20px;line-height:1.4;white-space:pre-wrap}
.big{font-size:22px}
.chk{width:100%;display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;font-size:19px;min-height:64px}
.chk .b{width:34px;height:34px;border-radius:50%;border:2px solid #C9BEB1;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.chk.on .b{background:var(--teal);border-color:var(--teal);color:#fff}
.chk.on{background:var(--tint-2)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;min-height:48px;color:var(--muted);font-size:16px}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.rota{width:100%;border-collapse:collapse;background:#fff}
.rota th,.rota td{padding:9px 8px;border-bottom:1px solid var(--line-2);text-align:center;font-size:15px;white-space:nowrap}
.rota th{font-size:12px;letter-spacing:1px;color:var(--muted);background:#FCFAF7}
.rota td:first-child,.rota th:first-child{text-align:left;font-weight:700}
.rota .me td{background:var(--tint-2)}
.sh{display:inline-block;border-radius:7px;padding:3px 7px;font-weight:700;background:var(--tint);color:var(--teal)}
.sh.off{background:var(--soft);color:var(--muted)} .sh.leave{background:var(--blue-bg);color:var(--blue)} .sh.sick{background:var(--amber-bg);color:var(--amber)}
.boxx{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
input[type=text],input[type=number],input[type=date],select,textarea{font-size:19px;padding:12px 14px;border:1px solid #C9BEB1;border-radius:12px;background:#fff;min-height:54px;width:100%;-webkit-user-select:text;user-select:text}
textarea{min-height:140px;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:70px}
.rcard b{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;line-height:1.1;display:block}
.pre{white-space:pre-wrap;line-height:1.45}
.photo{width:100%;max-height:360px;object-fit:cover;border-radius:14px}
.idchip{display:inline-flex;align-items:center;gap:8px;background:var(--tint);color:var(--teal);border-radius:999px;padding:8px 14px;font-weight:700}
.idchip button{background:none;border:0;color:var(--teal);text-decoration:underline;font-weight:600}
.day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.day.today{border:2px solid var(--teal)}
.note{font-size:13px;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:5px 9px;margin-top:6px;display:inline-block}
.tot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tot div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tot span{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;text-transform:uppercase}
.tot b{font-size:26px}
.setup{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.setup input{font-size:30px;letter-spacing:6px;text-transform:uppercase}
.phone main{max-width:640px;width:100%;margin:0 auto}
@media (orientation:portrait){ .pinwrap{gap:16px} .who{gap:10px;align-items:center;text-align:center} .cam{max-width:220px} .keys button{height:74px} main{padding-top:14px} }
@media (max-width:600px){ .brand img{width:40px;height:40px} .brand{flex:1 1 auto} .brand .t1{font-size:17px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .t2{display:none} .clock .c2{display:none} .clock .c1{font-size:24px} .hin{gap:8px} .hr{gap:8px;flex-shrink:0}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr))} .mod b{font-size:20px} .lang button{padding:6px 9px;min-height:40px;font-size:13px}
  .name{font-size:20px} .rlist{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <header><div class="hin">
    <div class="brand"><img src="mare-logo-white.svg" alt="Roberto's Mare"><div><div class="t1 serif" id="ttl">ROBERTO'S MARE</div><div class="t2" id="ttl2"></div></div></div>
    <div class="hr"><span id="lng"></span><div class="clock"><div class="c1" id="clk">--:--</div><div class="c2" id="clkd"></div></div></div>
  </div></header>
  <main id="main"></main>
</div>
<canvas id="snap" width="240" height="180" style="display:none"></canvas>
<script src="mare-i18n.js?v=20261006f"></script>
<script src="mare-common.js?v=20261006f"></script>
<script src="mare-team.js?v=20261006f"></script>
</body>
</html>
