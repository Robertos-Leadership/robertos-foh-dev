<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00575F">
<title>Roberto's Mare · Team</title>
<link rel="icon" href="mare-logo-teal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Roberto's Mare — the TEAM app. Two ways in:
     1. The TABLET at the staff entrance (paired once with a tablet code from
        the management app): clock in/out with name + 4-digit code + photo, and
        the team modules (briefing, checklists, rota, recipes, breakage, leave,
        speak up). Any action that is someone's asks for their name + code.
     2. A staff PHONE opening its private link (?me=…) + their code: their own
        hours and shifts, and the same modules. Phones never clock in.
     Database: mare_kiosk_* (clock-in), mare_s_* (modules), mare_me (hours).
     Dubai recipe cards are read-only from the Kitchen app. -->
<style>
:root{
  --rail:#0E3B3F; --teal:#0E4A50; --teal-2:#16606A; --tint:#E3ECEB; --tint-2:#EEF3F2; --cream:#F6F1EA; --card:#FFFFFF; --line:#E4DBCD; --line-2:#EFE8DD;
  --gold:#A8834B; --gold-2:#C9A46A; --ink:#1B2426; --muted:#4B5557; --soft:#EFE8DF;
  --red:#8A2E2E; --red-bg:#FBEDEC; --amber:#7A4A12; --amber-bg:#FBF1E2; --blue:#24406E; --blue-bg:#EAF0F8; --green:#285C36; --green-bg:#E8F2EA;
  --lift:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(14,59,63,.06),0 10px 22px -10px rgba(14,59,63,.22),0 28px 44px -26px rgba(14,59,63,.30);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:Karla,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.kiosk{-webkit-user-select:none;user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
.serif,h1,h2,.mod b,.rcard b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.app{min-height:100vh;display:flex;flex-direction:column}
header{color:#fff;position:relative;background:var(--rail) url('mare-hero.jpg') center 62%/cover no-repeat;flex-shrink:0}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,30,33,.92) 0%,rgba(8,30,33,.7) 55%,rgba(8,30,33,.45) 100%)}
.hin{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(16px,3vw,40px);padding-top:max(16px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{width:58px;height:58px;flex-shrink:0}
.brand .t1{font-size:clamp(22px,2.6vw,30px);letter-spacing:5px;line-height:1;font-weight:400}
.brand .t2{font-size:11px;letter-spacing:3.5px;opacity:.9;margin-top:6px;text-transform:uppercase}
.hr{display:flex;align-items:center;gap:18px}
.clock{text-align:right}
.clock .c1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(34px,4vw,50px);font-weight:400;font-variant-numeric:lining-nums;line-height:1}
.clock .c2{font-size:11px;letter-spacing:3px;opacity:.9;margin-top:4px;text-transform:uppercase}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:8px 13px;font-weight:700;font-size:13px;letter-spacing:1.5px;min-height:42px}
.lang button.on{background:#fff;color:var(--rail)}
main{flex:1;padding:24px clamp(16px,3vw,40px) 18px;display:flex;flex-direction:column;gap:20px;min-height:0}
h1{margin:0;font-size:clamp(30px,3.4vw,42px);font-weight:400;letter-spacing:.5px;color:var(--ink)}
h2{margin:0;font-size:26px;font-weight:500;color:var(--ink)}
h3{margin:0;font-size:18px}
.sec{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:3.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.sec i{flex:1;height:1px;background:var(--gold)}
/* raised cards */
.card,.mod,.name,.rcard,.day,.chk,.tot div{background:linear-gradient(180deg,#FFFFFF 0%,#FBF7F1 100%);border:1px solid rgba(168,131,75,.24);border-radius:12px;box-shadow:var(--lift);position:relative}
.card{padding:20px 22px}
.card::before,.mod::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:2px;background:linear-gradient(90deg,rgba(168,131,75,0),var(--gold),rgba(168,131,75,0))}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.mod{padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:118px;transition:transform .2s,box-shadow .2s}
.mod:active{transform:translateY(2px);box-shadow:0 2px 6px -2px rgba(14,59,63,.25)}
.mod .ic{color:var(--gold);display:flex}
.mod b{font-size:22px;line-height:1.05}
.mod span.s{font-size:10.5px;letter-spacing:1.5px;font-weight:700;color:var(--teal);margin-top:auto;text-transform:uppercase}
.mod span.s.alert{color:var(--red)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:start}
.group h2{margin:0 0 12px;font-family:Karla,sans-serif;font-size:11px;font-weight:700;letter-spacing:3.5px;color:var(--muted);display:flex;align-items:center;gap:12px}
.group h2::after{content:"";flex:1;height:1px;background:var(--gold)}
.names{display:flex;flex-direction:column;gap:12px}
.name{min-height:68px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;font-weight:500;transition:transform .15s}
.name:active{transform:translateY(2px)}
.pill{font-family:Karla,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1.5px;border-radius:4px;padding:4px 9px;white-space:nowrap;border:1px solid currentColor}
.pill.in{background:var(--teal);color:#fff;border-color:var(--teal)} .pill.out{color:var(--muted);background:var(--soft);border-color:rgba(75,85,87,.25)} .pill.new{color:var(--amber);background:var(--amber-bg);border-color:rgba(122,74,18,.35)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:13px;color:var(--muted);padding-bottom:max(4px,env(safe-area-inset-bottom))}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#2E7D32;margin-right:6px;vertical-align:middle}
.dot.off{background:var(--red)}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#FBF7F1);border:1px solid #D6CABA;border-radius:8px;padding:10px 18px;font-size:12px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;min-height:48px;box-shadow:0 4px 10px -8px rgba(14,59,63,.45)}
.pinwrap{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;justify-content:center}
.who{flex:1 1 300px;max-width:460px;display:flex;flex-direction:column;gap:16px}
.who .act{font-size:11px;letter-spacing:3.5px;color:var(--muted);font-weight:700}
.who .nm{font-size:clamp(48px,6vw,72px);line-height:1;color:var(--ink);font-weight:400}
.cam{width:100%;max-width:340px;aspect-ratio:4/3;border-radius:14px;background:#1B2426;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#C9D6D7;font-size:15px;text-align:center;padding:12px;box-shadow:var(--lift)}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pad{flex:0 1 420px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pad .lbl{font-size:11px;letter-spacing:3.5px;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase}
.dots{display:flex;gap:22px;height:28px;align-items:center}
.dots span{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--teal)}
.dots span.on{background:var(--teal)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
.keys button{height:clamp(66px,10vh,88px);border-radius:12px;border:1px solid rgba(168,131,75,.24);background:linear-gradient(180deg,#FFFFFF,#FBF7F1);box-shadow:var(--lift);font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:500;transition:transform .1s}
.keys button.small{font-family:Karla,sans-serif;font-size:12px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
.keys button:active{transform:translateY(2px);box-shadow:0 2px 4px rgba(14,59,63,.2)}
.msg{min-height:26px;font-size:17px;font-weight:700;text-align:center}
.msg.err{color:var(--red)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.tick{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--teal-2),var(--rail));display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -18px rgba(14,59,63,.6)}
.tick.warn{background:radial-gradient(circle at 35% 30%,#A5743A,var(--amber))}
.done .nm{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(46px,6vw,64px);color:var(--ink);line-height:1;font-weight:400}
.done .l1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(28px,4vw,38px);font-weight:500}
.done .l2{font-size:18px;color:var(--muted);max-width:640px}
.btn{background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#fff;border:1px solid var(--teal);border-radius:8px;padding:14px 26px;font-size:13px;letter-spacing:2px;font-weight:700;text-transform:uppercase;min-height:54px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 16px -10px rgba(14,59,63,.6)}
.btn.ghost{background:linear-gradient(180deg,#fff,#FBF7F1);color:var(--ink);border:1px solid #D6CABA;box-shadow:0 4px 10px -8px rgba(14,59,63,.45)}
.btn:disabled{opacity:.55}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:15px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:4px;padding:4px 9px;border:1px solid currentColor}
.tag.green{color:var(--green);background:var(--green-bg)} .tag.amber{color:var(--amber);background:var(--amber-bg)} .tag.grey{color:var(--muted);background:var(--soft)} .tag.blue{color:var(--blue);background:var(--blue-bg)} .tag.red{color:var(--red);background:var(--red-bg)}
.bf{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.bf .card h3{font-size:10.5px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.bf .card div{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;line-height:1.4;white-space:pre-wrap}
.big{font-size:20px}
.chk{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;font-size:18px;min-height:64px}
.chk .b{width:30px;height:30px;border-radius:50%;border:1.5px solid #C9BEB1;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff}
.chk.on .b{background:var(--teal);border-color:var(--teal);color:#fff}
.chk.on{background:linear-gradient(180deg,#F4F8F7,#EEF3F2)}
.tabs{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0 10px;font-size:12px;letter-spacing:2px;font-weight:700;color:var(--muted);text-transform:uppercase;min-height:48px}
.tabs button.on{color:var(--teal);border-bottom-color:var(--gold)}
.rota{width:100%;border-collapse:collapse}
.rota th,.rota td{padding:10px 8px;border-bottom:1px solid var(--line-2);text-align:center;font-size:15px;white-space:nowrap}
.rota th{font-size:10.5px;letter-spacing:1.5px;color:var(--muted)}
.rota td:first-child,.rota th:first-child{text-align:left;font-weight:700}
.rota .me td{background:var(--tint-2)}
.sh{display:inline-block;border-radius:5px;padding:4px 7px;font-weight:700;background:var(--tint);color:var(--teal);font-size:13.5px}
.rota-act{font-size:12px;font-weight:700;margin-top:4px;white-space:nowrap}.rota-act.done{color:var(--green)}.rota-act.live{color:var(--teal)}.rota-act.warn{color:var(--red)}
.sh.off{background:var(--soft);color:var(--muted)} .sh.leave{background:var(--blue-bg);color:var(--blue)} .sh.sick{background:var(--amber-bg);color:var(--amber)}
.boxx{overflow-x:auto;border:1px solid rgba(168,131,75,.24);border-radius:12px;background:linear-gradient(180deg,#FFFFFF,#FBF7F1);box-shadow:var(--lift)}
input[type=text],input[type=number],input[type=date],select,textarea{font-size:18px;padding:12px 14px;border:1px solid #D6CABA;border-radius:8px;background:#fff;min-height:54px;width:100%;-webkit-user-select:text;user-select:text;box-shadow:inset 0 1px 2px rgba(14,59,63,.05)}
textarea{min-height:140px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:10.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;letter-spacing:0;text-transform:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{padding:16px;text-align:left;min-height:74px}
.rcard b{font-size:23px;line-height:1.1;display:block}
.pre{white-space:pre-wrap;line-height:1.5}
.card .pre.big{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}
.rq-th{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.rq-th.on{border-top-color:var(--teal)}
.rq-m{background:var(--soft);border-radius:10px;padding:10px 14px;max-width:88%;align-self:flex-start}
.rq-m.chef{background:var(--tint);align-self:flex-end;border-left:3px solid var(--teal)}
.rq-w{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.photo{width:100%;max-height:360px;object-fit:cover;border-radius:12px;box-shadow:var(--lift)}
.idchip{display:inline-flex;align-items:center;gap:8px;background:var(--tint);color:var(--teal);border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px}
.idchip button{background:none;border:0;color:var(--teal);text-decoration:underline;font-weight:600}
.day{padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.day.today{border-color:var(--gold)}
.note{font-size:13px;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:5px 9px;margin-top:6px;display:inline-block}
.tot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tot div{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tot span{font-size:10.5px;letter-spacing:2px;color:var(--muted);font-weight:700;text-transform:uppercase}
.tot b{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:400;font-variant-numeric:lining-nums;line-height:1}
.setup{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.setup input{font-size:30px;letter-spacing:6px;text-transform:uppercase}
/* staff phone: the Concierge layout */
.phone header{background:var(--rail)} .phone header::before{display:none}
.phone main{max-width:640px;width:100%;margin:0 auto;padding-bottom:110px}
.nextshift .k{font-size:10.5px;letter-spacing:3px;font-weight:700;color:var(--muted)}
.nextshift .v{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;line-height:1.1;margin-top:6px;font-variant-numeric:lining-nums}
.nextshift .s{font-size:14px;color:var(--muted);margin-top:4px}
.bexc{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.5;margin-top:8px}
.lnk{align-self:flex-start;background:none;border:0;border-bottom:1px solid var(--teal);padding:0;font-size:12px;letter-spacing:1.5px;font-weight:700;color:var(--teal);margin-top:12px;text-transform:uppercase}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 6px max(14px,env(safe-area-inset-bottom));box-shadow:0 -10px 24px -16px rgba(14,59,63,.4)}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;letter-spacing:1.5px;font-weight:700;color:var(--muted);min-height:48px;text-transform:uppercase}
.bnav button i{width:22px;height:2px;background:transparent}
.bnav button.on{color:var(--teal)} .bnav button.on i{background:var(--gold)}
.bnav{max-width:640px;margin:0 auto}
body.pvphone{background:#E6DED3} body.pvphone main{max-width:430px;background:var(--cream);border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
body.pvphone .bnav{max-width:430px}
@media (orientation:portrait){ .pinwrap{gap:16px} .who{gap:10px;align-items:center;text-align:center} .back{align-self:center} .cam{max-width:220px} .keys button{height:72px} main{padding-top:16px} }
@media (max-width:600px){ .brand img{width:40px;height:40px} .brand{flex:1 1 auto} .brand .t1{font-size:17px;letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .t2{display:none} .clock .c2{display:none} .clock .c1{font-size:28px} .hin{gap:8px} .hr{gap:8px;flex-shrink:0}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr))} .mod b{font-size:20px} .lang button{padding:6px 9px;min-height:40px;font-size:12px}
  .name{font-size:22px} .rlist{grid-template-columns:1fr} }

/* voice notes, files, dictation */
.mbox .rec{gap:12px}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#B3261E;animation:recp 1s infinite}
@keyframes recp{50%{opacity:.25}}
.rec-t{font-variant-numeric:tabular-nums;font-size:18px}
.upl{display:inline-flex;align-items:center;cursor:pointer}
.mlist{display:flex;flex-direction:column;gap:10px}
.media{border:1px solid rgba(168,131,75,.24);border-radius:10px;background:#fff;box-shadow:0 6px 14px -10px rgba(14,59,63,.35);position:relative}
.media-open{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:12px 44px 12px 14px;text-align:left}
.media-open b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:500}
.media-ic{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:radial-gradient(circle at 35% 30%,#16606A,#0E3B3F)}
.media-x{position:absolute;right:8px;top:12px;width:32px;height:32px;border:0;border-radius:6px;background:none;color:#8A2E2E;font-size:15px}
.media-body{padding:0 14px}
.media-body:not(:empty){padding:0 14px 14px}
.dict{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid #D6CABA;border-radius:6px;padding:5px 10px;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#0E4A50;text-transform:uppercase}
.dict.on{background:#FBEDEC;color:#8A2E2E;border-color:rgba(138,46,46,.4)}

/* Dubai cards under Dubai's own sections */
.dsec .sec em{font-style:normal;font-size:11px;letter-spacing:1px;color:var(--muted, #6B7375)}
.dsec{margin-bottom:6px}
.dlines{list-style:none;margin:0;padding:0}.dlines li{padding:7px 0;border-bottom:1px solid var(--line);line-height:1.45}.dlines li:last-child{border-bottom:0}.sublink{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;min-height:44px;color:var(--teal)}.sublink span{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}.sublink em{font-style:normal;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:1px solid var(--teal);border-radius:999px;padding:3px 9px}.sublink:hover em,.sublink:focus-visible em{background:var(--teal);color:#fff}
.card .dlines{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}
/* ── Schedule in the Dubai format (9 Oct 2026) ── */
.rw-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rw-nav b{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:500}
.rw-nav .btn.sm,.btn.sm{min-height:44px;padding:8px 16px;font-size:18px;letter-spacing:0}
.rw-nav .lnk{margin-top:0}
.dsch th,.dsch td{padding:8px 6px;font-size:13.5px;vertical-align:top}
.dsch th span{font-weight:400;letter-spacing:0;font-size:10.5px}
.dsch th.td,.dsch td.td{background:rgba(201,164,106,.12)}
.dsch td.role{font-size:12px;color:var(--muted);text-align:left;white-space:normal;min-width:64px}
.dsch td:first-child{position:sticky;left:0;background:#FFFDF9;z-index:1}
.dsch tr.team td{background:#FCFAF7;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted);text-align:left}
.dsch tr.sum td{font-size:12px;font-weight:700;color:var(--muted)}
.dsch td.ed{cursor:pointer}
.dsch td.ed:hover{background:var(--tint-2)}
.dsch .sh{font-size:12.5px;padding:3px 6px}
.dsch .sh2{font-size:11px;color:var(--teal);font-weight:700;margin-top:3px}
.dsch .add{color:#B9AE9F;font-size:18px;font-weight:700}
.rsheet-bg{position:fixed;inset:0;background:rgba(14,30,32,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.rsheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -20px 40px -20px rgba(14,59,63,.5)}
.rsheet .tabs{gap:16px}
.rq-hd{font-size:10.5px;letter-spacing:2px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.rq{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.rq button{background:#fff;border:1px solid #D6CABA;border-radius:8px;padding:10px 6px;font-weight:700;font-size:15px;color:var(--teal);display:flex;flex-direction:column;align-items:center;gap:2px}
.rq button small{font-size:11px;color:var(--muted)}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt label{display:flex;flex-direction:column;gap:6px;font-size:10.5px;letter-spacing:2px;font-weight:700;color:var(--muted);text-transform:uppercase}
.hm{display:flex;align-items:center;gap:4px;font-size:18px;color:var(--ink)}
.hm select{min-height:50px;padding:8px 6px;font-size:18px}
/* ── Kitchen closing report (Dubai sections) ── */
.kr-card{background:linear-gradient(180deg,#FFFFFF 0%,#FBF7F1 100%);border:1px solid rgba(168,131,75,.24);border-radius:12px;box-shadow:var(--lift);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.kr-t{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;color:var(--teal)}
.kr-faces{display:flex;gap:8px}
.kr-faces button{flex:1;min-height:52px;font-size:26px;background:#fff;border:1px solid #D6CABA;border-radius:10px;filter:grayscale(.7);opacity:.7}
.kr-faces button.on{filter:none;opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-2)}
.kr-chips{display:flex;flex-wrap:wrap;gap:8px}
.kr-chips button{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid #D6CABA;background:#fff;font-weight:700;font-size:14px;color:var(--ink)}
.kr-chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.kr-empty{color:var(--green);font-weight:700;font-size:15px}
.kr-entry{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 44px 10px 12px;font-size:15px}
.kr-entry div{margin-top:4px}
.kr-cat{font-size:10.5px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;color:var(--amber);background:var(--amber-bg);border-radius:4px;padding:3px 7px}
.kr-act{color:var(--muted);font-size:14px}
.kr-del{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;font-size:16px;color:var(--muted)}
.kr-add{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.kr-plus{align-self:flex-start;background:none;border:1px dashed #C9BEB1;border-radius:8px;padding:10px 16px;font-weight:700;color:var(--teal);min-height:44px}
.kr-sent{background:var(--green-bg);color:var(--green);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
.kr-sent.warn{background:var(--amber-bg);color:var(--amber)}
.kr-hist{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:15px;border-bottom:1px solid var(--line-2);padding:6px 0}
.kr-card textarea{min-height:110px}
/* simple closing report + fixes (9 Oct 2026) */
.rt[hidden],#rtimes[hidden]{display:none}
.kr-q{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;color:var(--ink);line-height:1.2}
.kr-opt{font-family:Karla,sans-serif;font-size:13px;font-weight:400;color:var(--muted)}
.kr-yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kr-yn button{min-height:56px;border-radius:10px;border:1px solid #D6CABA;background:#fff;font-size:17px;font-weight:700;color:var(--ink)}
.kr-yn button.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.kr-yn button.on.yes{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.kr-duty{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;flex-wrap:wrap}
.kr-duty .lnk{margin-top:0}
body.phone #fbi-btn{bottom:calc(84px + env(safe-area-inset-bottom,0px)) !important}
.kr-fig{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kr-fig input{font-size:22px}
.kr-avg{font-size:14px;font-weight:700;color:var(--teal);min-height:18px}
/* Learning (9 Oct 2026) */
.ln-intro{margin:0;font-size:16px;color:var(--muted)}
.ln-p{margin:0;font-size:16px}
.ln-list{display:flex;flex-direction:column;gap:10px}
.ln-topic{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(180deg,#FFFFFF 0%,#FBF7F1 100%);border:1px solid rgba(168,131,75,.24);border-radius:12px;box-shadow:var(--lift);padding:12px 14px;min-height:64px;color:var(--ink)}
.ln-topic b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:600;line-height:1.15}
.ln-topic small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ln-n{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--teal);font-weight:700;display:grid;place-items:center;flex:none}
.ln-go{margin-left:auto;font-size:24px;color:var(--gold)}
.ln-body{white-space:pre-wrap;font-size:17px;line-height:1.55}
.ln-bar{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden}
.ln-bar i{display:block;height:100%;background:var(--teal)}
.ln-qhead{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.ln-clock{color:var(--teal)} .ln-clock.low{color:var(--red)}
.ln-choices{display:flex;flex-direction:column;gap:10px}
.ln-choice{text-align:left;min-height:54px;padding:12px 14px;border-radius:10px;border:1px solid #D6CABA;background:#fff;font-size:16px;color:var(--ink)}
.ln-choice.on{background:var(--tint);border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset;font-weight:700}
.ln-score{font-family:'Cormorant Garamond',Georgia,serif;font-size:64px;line-height:1}
.ln-score.good,.ln-per .good,.ln-wrong .good{color:var(--green)} .ln-score.bad,.ln-per .bad,.ln-wrong .bad{color:var(--red)}
.ln-per{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-2);padding:6px 0;font-size:15px}
.ln-wrong{border-bottom:1px solid var(--line-2);padding:8px 0;font-size:15px;display:flex;flex-direction:column;gap:2px}
/* Learning formats (9 Oct 2026) */
.ln-hint{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.ln-multi{display:flex;align-items:center;gap:12px}
.ln-box{width:26px;height:26px;border-radius:6px;border:1.5px solid #C9BEB1;display:grid;place-items:center;flex:none;font-weight:700;background:#fff}
.ln-multi.on .ln-box{background:var(--teal);border-color:var(--teal);color:#fff}
.ln-order{display:flex;flex-direction:column;gap:8px;touch-action:none}
.ln-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #D6CABA;border-radius:10px;padding:12px 14px;min-height:54px;font-size:16px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.ln-row.drag{box-shadow:0 10px 24px -8px rgba(14,59,63,.45);border-color:var(--teal);background:var(--tint-2);cursor:grabbing}
.ln-grip{color:var(--gold);font-size:20px}
.ln-pos{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--teal);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.ln-match{display:flex;flex-direction:column;gap:12px}
.ln-pair{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.ln-pair select{font-weight:400}
.ln-shots{display:flex;gap:6px;flex-wrap:wrap}
.ln-shots img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ln-choice.pic{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
