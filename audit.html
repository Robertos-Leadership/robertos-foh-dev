<style>
@import url('https://fonts.googleapis.com/css2?family=Forum&family=Outfit:wght@400;500;600;700&display=swap');

   tan hairlines; Forum for headings, Outfit for text. The older names below point at the new colours so
   every screen follows. */
:root{
  --vino:#450207;--accent:#FA4700;--ink:#3A332C;--muted:#6E5A4C;--body:#4F4238;
  --line:#D8C4AC;--soft:#EFE4D6;--sand:#E8D9C7;--paper:#FBF7F1;--door:#F6EFE6;
  --sabbia:#E8D9C7;--sabbia-light:#EFE4D6;--sabbia-dark:#D8C4AC;--terra:#450207;--cream:#FBF7F1;--vino-mid:#6B1A20;
  --ok:#2F6B2F;--ok-bg:#EEF4EA;--below:#8A5A00;--below-bg:#F6EBD4;--err:#B23A00;--err-bg:#FCEBE2;
  --display:'Forum',Georgia,'Times New Roman',serif;
  --sans:'Outfit',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.app.wide{max-width:820px}
.top{background:var(--paper);color:var(--ink);padding:24px 20px 18px;padding-top:max(24px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:22px;width:auto;display:block}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.top h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.08;margin:0;color:var(--vino)}
.top .sub{font-size:15px;line-height:1.5;color:var(--body)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font-size:13px;font-weight:500;padding:7px 12px;border:0;background:transparent;color:var(--muted);min-height:34px}
.lang button.on{background:var(--vino);color:var(--paper)}
.bar{display:flex;align-items:center;gap:12px}
.bar .track{flex:1;height:6px;background:var(--sand);border-radius:3px;overflow:hidden}
.bar .fill{height:6px;background:var(--vino)}
.bar b{font-size:14px;font-weight:600;color:var(--vino);white-space:nowrap}
.body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.lbl{font-size:13px;font-weight:600;color:var(--vino);padding:0 2px;margin-top:8px}
.lbl small{font-weight:400;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.sec{display:flex;align-items:center;gap:14px;padding:13px 15px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;min-height:64px}
.sec:hover{border-color:var(--vino)}
.sec.now{border:2px solid var(--vino);padding:12px 14px}
.sec.final{background:var(--door)}
.dot{flex:none;width:28px;height:28px;border-radius:14px;background:var(--sand);color:var(--vino);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.dot.done{background:var(--vino);color:var(--paper)}
.dot.go{background:transparent;border:2px solid var(--vino);color:var(--vino)}
.dot.star{background:var(--vino);color:var(--paper)}
.sec .t{display:block;font-family:var(--display);font-size:20px;color:var(--vino);line-height:1.2}

.head{padding:14px 20px 14px;padding-top:max(14px,env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.head .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--vino);background:none;border:0;padding:0;min-height:44px}

.head .hint{font-size:15px;line-height:1.5;color:var(--body);margin:0}
.head .prev{font-size:12.5px;color:var(--muted)}
.qk{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qk .kick{font-size:12px}
.segs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

.scores{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}

.sbtn{height:56px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px;font-weight:600;color:var(--ink)}

.ybtn.yes.on{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.ybtn.no.on{border:2px solid var(--err);background:var(--err-bg);color:var(--err);font-weight:600}

.note textarea.small{min-height:52px}
.note .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.mic.dict{min-width:46px;justify-content:center;padding:0 12px;font-weight:600}
.note .said{font-size:13px;color:var(--muted);min-height:0}.note .said:empty{display:none}.note .said .link{padding:0;font-size:13px}

.mic.live{background:var(--err);border-color:var(--err);color:#fff;animation:pulse 1.2s infinite}

.saved.ok::before{content:'';width:12px;height:7px;border-left:2.4px solid currentColor;border-bottom:2.4px solid currentColor;transform:rotate(-45deg) translateY(-2px)}
.saved.ing{color:var(--muted)}
.saved.bad{color:var(--err);font-weight:600}
.pics{display:flex;gap:6px;flex-wrap:wrap}
.pic{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--sand)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(58,51,44,.8);color:#fff;font-size:15px;line-height:26px;padding:0}
.pic.up{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.en{font-size:13px;line-height:1.45;color:var(--muted);border-top:1px solid var(--soft);padding-top:8px}
.en b{color:var(--vino);font-size:11px;letter-spacing:.12em}
.foot{position:sticky;bottom:0;padding:12px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);display:flex;gap:10px}
.foot.static{position:static}
.big{flex:1;min-height:52px;border-radius:12px;border:0;font-weight:500;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.big.vino,.big.terra{background:var(--vino);color:var(--paper)}
.big.light{background:#fff;border:1px solid var(--line);color:var(--vino)}
.big:disabled{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;min-height:42px}
.chip.on{background:var(--vino);color:var(--paper);border-color:var(--vino)}
.pick{padding:14px;display:flex;flex-direction:column;gap:8px}
.pick input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:17px;background:#fff;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;padding:12px;border:0;border-top:1px solid var(--soft);background:#fff;font-size:15px}
.opt small{color:var(--muted);margin-left:6px}
.menu{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.msec{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 14px;border:0;border-top:1px solid var(--soft);background:#fff;text-align:left;font-family:var(--display);font-size:19px;color:var(--vino)}
.msec:first-child{border-top:0}
.msec span{flex:1}
.msec small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.msec.on{background:var(--door)}
.opt.in{padding:13px 14px 13px 28px;font-size:16px;min-height:48px}
.kcard{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:76px;width:100%}
.kcard.on{border:2px solid var(--vino);padding:15px}
.kcard .r{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.kcard.on .r{border-color:var(--vino)}
.kcard.on .r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--vino)}
.kcard .t{display:block;font-family:var(--display);font-size:22px;color:var(--vino);line-height:1.15}
.kcard .s{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.shot{min-height:200px;border-radius:12px;border:2px dashed var(--line);background:var(--door);color:var(--vino);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:17px;width:100%}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}

.act textarea,.rtext textarea,.item textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;line-height:1.45;background:var(--paper);min-height:44px;resize:vertical}

.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--vino);font-weight:500;font-size:13px}

}
</style>

/* ── behaviour ──────────────────────────────────────────────────────────── */
function autosize(){
  var ts = root.querySelectorAll('textarea');
  for (var i = 0; i < ts.length; i++) { ts[i].style.height = 'auto'; ts[i].style.height = Math.max(ts[i].scrollHeight + 2, ts[i].classList.contains('small') ? 52 : 44) + 'px'; }
}
function saveNote(el){
  var target = el.getAttribute('data-save'), ref = el.getAttribute('data-ref'), v = el.value;
  if (target === 'score') { var r = scoreRow(ref); r._local = v; queue('score:' + ref + ':note', 'score', { code: ref, note_it: v }); }
  else if (target === 'dish') { var d = byId(D.dishes, ref); if (d) d._local = v; queue('dish:' + ref + ':note', 'dish', { id: ref, note_it: v }); }
  else if (target === 'flag') { var f = byId(D.flags, ref); if (f) f._local = v; queue('flag:' + ref + ':note', 'flag', { id: ref, note_it: v }); }
  else if (target === 'text') { var x = textRow(ref); x._local = v; queue('text:' + ref, 'text', { key: ref, it: v }); }
}
/* When a save lands the server row is merged in, then anything still waiting in the queue
   is laid back on top, so a newer tap or word is never undone by an older reply. */
var _merge = merge;
merge = function(action, row){ _merge(action, row); applyPending(); };
function applyPending(){
  if (!D) return;
  [D.scores, D.dishes, D.flags, D.texts].forEach(function(l){ l.forEach(function(r){ delete r._local; }); });
  Object.keys(PEND).forEach(function(k){
    var j = PEND[k], p = j.payload, r = null;
    if (j.action === 'score') r = scoreRow(p.code);
    else if (j.action === 'dish') r = byId(D.dishes, p.id);
    else if (j.action === 'flag') r = byId(D.flags, p.id);
    else if (j.action === 'text') { textRow(p.key)._local = p.it; return; }
    else if (j.action === 'set') { ['en', 'owner', 'due'].forEach(function(c){ if (c in p) setLocal(p.target, p.ref, c === 'en' ? (p.target === 'text' ? 'en' : 'note_en') : c, p[c]); }); return; }
    if (!r) return;
    Object.keys(p).forEach(function(c){ if (c === 'note_it') r._local = p[c]; else if (c !== 'id' && c !== 'code') r[c] = p[c]; });
  });
}

root.addEventListener('input', function(e){
  var el = e.target;
  if (el.matches('textarea')) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
  if (el.matches('textarea[data-save]')) saveNote(el);
  else if (el.matches('textarea[data-en]')) {
    var tg = el.getAttribute('data-target'), rf = el.getAttribute('data-ref');
    setLocal(tg, rf, tg === 'text' ? 'en' : 'note_en', el.value);
    queue('en:' + tg + ':' + rf, 'set', { target: tg, ref: rf, en: el.value });
  } else if (el.id === 'aname') { S.name = el.value;
  } else if (el.id === 'pq') {
    S.q = el.value;
    var box = document.getElementById('pres'); if (box) box.innerHTML = presHtml(el.getAttribute('data-mode'));
  }
});

root.addEventListener('change', function(e){

function setLocal(target, ref, col, v){
  var r = target === 'score' ? scoreRow(ref) : target === 'text' ? textRow(ref) : byId(target === 'dish' ? D.dishes : D.flags, ref);
  if (r) r[col] = v;
}

    else { var n = +v; r.score = r.score === n && !r.na ? null : n; r.na = false; queue('score:' + S.code + ':s', 'score', { code: S.code, score: r.score }); }

    else { var sv = vy === 'yes' ? 5 : 0; ry.score = (has(ry) && ry.score === sv) ? null : sv; ry.na = false; queue('score:' + S.code + ':s', 'score', { code: S.code, score: ry.score }); }
    render(); return;
  }
  if (act === 'verdict') { var r2 = scoreRow(S.code), vv = b.getAttribute('data-v'); r2.verdict = r2.verdict === vv ? null : vv; queue('score:' + S.code + ':v', 'score', { code: S.code, verdict: r2.verdict }); render(); return; }

  if (act === 'said') {

    // Only while the box still holds the tidied text: anything typed since is never thrown away.
    if (se && SAID[sk] && se.value === SAID[sk].tidy) { se.value = SAID[sk].raw; saveNote(se); }
    delete SAID[sk]; if (se) setSaid(se);
    return;

  if (act === 'photo') { pickPhoto(b.getAttribute('data-target'), b.getAttribute('data-ref')); return; }
  if (act === 'pdel') { delPhoto(b.getAttribute('data-target'), b.getAttribute('data-ref'), b.getAttribute('data-path')); return; }
  if (act === 'dish') { go({ v: 'dish', id: b.getAttribute('data-id') }); return; }
  if (act === 'pickdish') { pickDish(b.getAttribute('data-mode'), b.getAttribute('data-id') || null, b.getAttribute('data-name')); return; }
  if (act === 'dscore') { var d = byId(D.dishes, S.id), n2 = +b.getAttribute('data-v'); d.score = d.score === n2 ? null : n2; queue('dish:' + d.id + ':s', 'dish', { id: d.id, score: d.score }); render(); return; }
  if (act === 'dverdict') { var d2 = byId(D.dishes, S.id), v2 = b.getAttribute('data-v'); d2.verdict = d2.verdict === v2 ? null : v2; queue('dish:' + d2.id + ':v', 'dish', { id: d2.id, verdict: d2.verdict }); render(); return; }
  if (act === 'ddel') { var d3 = byId(D.dishes, S.id); api('dish', { id: d3.id, remove: true }).then(function(){ D.dishes = D.dishes.filter(function(x){ return x.id !== d3.id; }); go({ v: 'dishes' }, true); }, function(er){ toast(er.message, true); }); return; }
  if (act === 'newflag') { S.q = ''; go({ v: 'flag' }); return; }

  if (act === 'farea') { var f1 = byId(D.flags, S.id); f1.area = b.getAttribute('data-a'); queue('flag:' + f1.id + ':a', 'flag', { id: f1.id, area: f1.area }); render(); return; }
  if (act === 'fkind') { var f2 = byId(D.flags, S.id); f2.kind = b.getAttribute('data-v'); queue('flag:' + f2.id + ':k', 'flag', { id: f2.id, kind: f2.kind }); render(); return; }
  if (act === 'fpick') { S.picking = true; S.q = ''; render(); var q = document.getElementById('pq'); if (q) q.focus(); return; }

  if (act === 'submit') { submit(b); return; }

    ['aname', 'adate', 'atime'].forEach(function(id, i){ var e = document.getElementById(id); if (e) S[['name', 'vdate', 'vtime'][i]] = e.value; });

// One add at a time: the list stays on screen until the server answers, and Danilo's taps in
// that gap saved Burrata four times (21 Oct 2026). A dish already in this audit is opened, not added again.
var ADDING = null;
function createFlag(){
  if (ADDING) return ADDING;
  ADDING = api('flag', { area: 'piatto', kind: 'attention' }).then(function(res){ ADDING = null; D.flags.push(res.row); return res.row; }, function(er){ ADDING = null; toast(er.message, true); throw er; });
  return ADDING;
}
function pickDish(mode, id, name){
  name = (name || '').trim(); if (!name) return;
  if (mode === 'adddish') {
    if (ADDING) return;
    var same = D.dishes.filter(function(x){ return !x.removed && (id ? x.recipe_id === id : !x.recipe_id && low(x.dish_name || '') === low(name)); })[0];
    S.q = ''; S.picking = false;
    if (same) { go({ v: 'dish', id: same.id }); return; }
    root.querySelectorAll('[data-act="pickdish"]').forEach(function(x){ x.disabled = true; });
    ADDING = api('dish', { dish_name: name, recipe_id: id }).then(function(res){ ADDING = null; D.dishes.push(res.row); go({ v: 'dish', id: res.row.id }); }, function(er){ ADDING = null; toast(er.message, true); render(); });
    return;
  }
  S.q = ''; S.picking = false;
  var f = byId(D.flags, S.id); f.dish_name = name; f.recipe_id = id;
  queue('flag:' + f.id + ':d', 'flag', { id: f.id, dish_name: name, recipe_id: id }); render();
}
function submit(b){
  if (!b._sure) { b._sure = true; b.textContent = t('sendSure'); setTimeout(function(){ if (b.isConnected) { b._sure = false; b.textContent = isEnrico() ? t('send') : t('sendTeam'); } }, 5000); return; }
  b.disabled = true; b.textContent = t('saving');
  waitSaved().then(function(){ return api('submit', { page: location.origin + location.pathname }); }).then(function(r){ if (r && r.pct) D.pct = r.pct; D.visit.status = D.visit.status === 'test' ? 'test' : 'submitted'; go({ v: 'thanks' }); }, function(er){ b.disabled = false; b._sure = false; b.textContent = t('send'); toast(er.message, true); });
}
function waitSaved(){
  return new Promise(function(res, rej){
    // Waits as long as saves keep landing; gives up only after 40 s with no progress (it used to
    // give up after 30 s in all, with saves still going through).
    var left = -1, still = 0; flushSoon(0);
    (function check(){
      var k = Object.keys(PEND).length;
      if (!k && !BUSY && !anyUploading()) return res();
      if (k !== left) { left = k; still = 0; } else if (++still > 160) return rej(new Error(t('notSaved')));
      setTimeout(check, 250);
    })();
  });
}
function runTranslate(b){
  b.disabled = true; var old = b.textContent; b.textContent = 'Translating…';
  waitSaved().then(function(){ return api('translate'); }).then(function(r){ return reload().then(function(){ toast(r.translated ? r.translated + ' notes translated' : 'Everything is already in English'); }); })
    .catch(function(er){ toast(er.message, true); }).then(function(){ if (b.isConnected) { b.disabled = false; b.textContent = old; } });
}
function sendReport(b, action){
  b.disabled = true; b.textContent = 'Sending…';
  waitSaved().then(function(){ return api(action); }).then(function(r){
    toast('Sent to ' + r.to.join(', '));
    return reload();
  }).catch(function(er){ toast(er.message, true); render(); });
}
function copyText(s){
  var done = function(){ toast('Link copied'); };
  var show = function(){ toast(s); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, show);
  else show();
}

/* ── photos: resized on the phone (max 1600px) before upload ──────────── */
var UPLOADING = {};
function anyUploading(){ for (var k in UPLOADING) if (UPLOADING[k].length) return true; return false; }
var fileEl = document.getElementById('file'), PHOTO_FOR = null;
function pickPhoto(target, ref){ PHOTO_FOR = { target: target, ref: ref }; fileEl.value = ''; fileEl.click(); }
fileEl.addEventListener('change', function(){
  var files = Array.prototype.slice.call(fileEl.files || []), dest = PHOTO_FOR; if (!dest || !files.length) return;
  if (dest.ref === '__new') {
    createFlag().then(function(f){ PHOTO_FOR = { target: 'flag', ref: f.id }; go({ v: 'flag', id: f.id }, true); upload(files, PHOTO_FOR); });
    return;
  }
  upload(files, dest);
});
function upload(files, dest){
  var key = dest.target + ':' + dest.ref;
  files.forEach(function(file){
    UPLOADING[key] = (UPLOADING[key] || []).concat([1]); render();
    shrink(file).then(function(b64){ return api('photo', { target: dest.target, ref: dest.ref, data: b64 }); }).then(function(res){
      D.urls[res.path] = res.url;
      var row = dest.target === 'score' ? scoreRow(dest.ref) : dest.target === 'text' ? textRow(dest.ref) : byId(dest.target === 'dish' ? D.dishes : D.flags, dest.ref);
      if (row) row.photos = res.row.photos;
    }, function(){ toast(t('photoFail'), true); }).then(function(){ UPLOADING[key].pop(); render(); });
  });
}
function shrink(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function delPhoto(target, ref, path){
  api('photo_del', { target: target, ref: ref, path: path }).then(function(res){
    var row = target === 'score' ? scoreRow(ref) : target === 'text' ? textRow(ref) : byId(target === 'dish' ? D.dishes : D.flags, ref);
    if (row) row.photos = res.row.photos; render();
  }, function(er){ toast(er.message, true); });
}

/* ── dictation: the iPhone's own speech recognition, Italian ──────────── */
var REC = null, REC_ID = null;
function low(s){ return String(s).toLowerCase().replace(/\s+/g, ' ').trim(); }
function stopMic(){ if (REC) { try { REC._byUser = true; REC.stop(); } catch(e){} } }
function markMic(){
  if (!REC_ID) return;
  var b = root.querySelector('.mic[data-for="' + REC_ID + '"]');
  if (b && !b.classList.contains('live')) { b.classList.add('live'); b.querySelector('span').textContent = t('stop'); }
}
function toggleMic(btn){
  var id = btn.getAttribute('data-for'), ta = document.getElementById(id);
  if (REC && REC_ID === id) { stopMic(); return; }
  stopMic();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast(t('noMic')); ta.focus(); return; }
  var rec = new SR(); REC = rec; REC_ID = id;
  SAID[ta.getAttribute('data-save') + ':' + ta.getAttribute('data-ref')] = { listening: true }; setSaid(ta);
  // Listens in the language on screen (IT/EN at the top): an English speaker on an Italian listener
  // came out as half-English nonsense (Francesco's test, 15 Oct 2026).
  rec.lang = DICT === 'en' ? 'en-GB' : 'it-IT';
  rec.continuous = true; rec.interimResults = true;
  // The text is rebuilt from the whole result list on every event, never appended to. The iPhone
  // sends each "final" result as the whole sentence so far ("Sì", "Sì allora", "Sì allora tutto
  // bene"…), so appending each one saved Danilo's note as one phrase repeated ~30 times (21 Oct 2026).
  // A result that starts with what came before replaces it; anything else is a new piece.
  // If the list starts over after a final result, what was heard before is kept; an unfinished
  // guess that changes ("benne" → "bene") is replaced.
  var base = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '', kept = '', last = '', lastFinal = false;
  rec.onresult = function(ev){
    var heard = '', n = ev.results.length;
    for (var i = 0; i < n; i++) {
      var s = ev.results[i][0].transcript.replace(/\s+/g, ' ').trim();
      if (!s) continue;
      if (heard && low(s).indexOf(low(heard)) !== 0) heard += ' ' + s; else heard = s;
    }
    if (last && lastFinal && low(heard).indexOf(low(last)) !== 0) kept += last + ' ';
    last = heard; lastFinal = n > 0 && ev.results[n - 1].isFinal;
    var el = document.getElementById(id) || ta;
    el.value = (base + kept + heard).replace(/\s+$/, '') + ' ';
    el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px';
    saveNote(el);
  };
  rec.onerror = function(ev){ if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast(t('micBlocked'), true); };
  rec.onend = function(){
    if (REC === rec) { REC = null; REC_ID = null; }
    var b = document.querySelector('.mic.live'); if (b) { b.classList.remove('live'); b.querySelector('span').textContent = speakLabel(); }
    var kk = ta.getAttribute('data-save') + ':' + ta.getAttribute('data-ref'); delete SAID[kk];
    if (!rec._byUser) toast(t('micStopped'));   // the phone ended it, not the guest
    var el = document.getElementById(id); if (el) { el.value = el.value.replace(/\s+$/, ''); saveNote(el); setSaid(el);
      if (el.value.indexOf(base) === 0 || !base) tidyDictation(el, base, el.value.slice(base.length).trim()); }
  };
  try { rec.start(); } catch(e){ toast(t('noMic')); return; }
  btn.classList.add('live'); btn.querySelector('span').textContent = t('stop');
}

/* ── start ──────────────────────────────────────────────────────────────── */
function reload(){
  return api('load').then(function(d){
    if (d.role === 'invite' || d.role === 'invite_admin') {
      D = d;
      // Chef Bartolini's own invite (30 Oct 2026): Italian first, like his own audit, unless he chose otherwise.
      if (d.enrico && !ls('auditLang') && LANG !== 'it') { LANG = 'it'; document.documentElement.lang = 'it'; }
      render(); return;
    }
    // Keep anything typed but not yet saved.
    var local = {};
    if (D) { D.scores.forEach(function(r){ if (r._local != null) local['s:' + r.code] = r._local; }); D.texts.forEach(function(r){ if (r._local != null) local['t:' + r.key] = r._local; });
             D.dishes.forEach(function(r){ if (r._local != null) local['d:' + r.id] = r._local; }); D.flags.forEach(function(r){ if (r._local != null) local['f:' + r.id] = r._local; }); }
    D = d; setAreas();
    // Italian first is for Enrico only: anyone else opening their own audit link gets English
    // unless they chose otherwise (a guest landed on Italian after Start, 22 Oct 2026).
    if (!ls('auditLang') && D.visit && D.visit.auditor !== ENRICO && LANG !== 'en') { LANG = 'en'; document.documentElement.lang = 'en'; }
    D.scores.forEach(function(r){ if (local['s:' + r.code] != null) r._local = local['s:' + r.code]; });
    D.texts.forEach(function(r){ if (local['t:' + r.key] != null) r._local = local['t:' + r.key]; });
    D.dishes.forEach(function(r){ if (local['d:' + r.id] != null) r._local = local['d:' + r.id]; });
    D.flags.forEach(function(r){ if (local['f:' + r.id] != null) r._local = local['f:' + r.id]; });
    // Saves still waiting (also from an earlier visit to this page) win over what the server has.
    applyPending();
    render();
  });
}
if (!TOK) render();
else {
  document.documentElement.lang = LANG;
  try { history.replaceState(S, '', location.search); } catch(e){}
  reload().then(function(){ flushSoon(0); }, function(er){
    root.innerHTML = topBar('<h1>Audit</h1>') + '<div class="body"><div class="msg err">' + esc(er.status === 403 ? t('badLink') : (navigator.onLine ? er.message : t('offline'))) + '</div></div>';
  });
}
window.addEventListener('offline', function(){ toast(t('offline'), true); });
</script>
