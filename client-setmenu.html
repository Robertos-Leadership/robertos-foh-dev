<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roberto's — Your menu choices</title>
<link rel="stylesheet" href="client-brand.css">
<style>
  body{margin:0;background:var(--page);font-family:var(--font-body);color:var(--ink)}
  .wrap{max-width:520px;margin:0 auto;padding:18px 14px 40px}
  .card{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden}
  .brand{text-align:center;padding:26px 20px 20px}
  .brand img{display:block;width:min(250px,64%);height:auto;margin:0 auto}
  .sub{font-size:14px;color:var(--ink-soft);text-align:center}
  .sub2{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:3px;font-family:var(--font-body)}
  .sect{border-top:1px solid var(--line-soft);margin:16px 22px 0;padding-top:13px}
  .sect-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .sect-h b{font-size:15px;color:var(--vino);font-weight:normal}
  /* The house course heading — gold, letter-spaced small caps. Identical to
     client-menus.html and client-agreement.html, so a menu sent from here does
     not look like a different restaurant's. */
  .sect-t{text-align:center;font-size:11px;letter-spacing:3px;color:var(--warn);text-transform:uppercase;margin-bottom:10px;font-family:var(--font-body)}
  .sect-n{text-align:center;font-size:11px;color:var(--ink-faint);font-family:var(--font-body);margin:-6px 0 8px}
  .pr{font-size:12.5px;color:var(--ink-soft);text-align:center;font-family:var(--font-body);margin-top:4px}
  .cnt{font-size:11px;font-family:var(--font-body)}
  .hint{font-size:12px;color:var(--ink-soft);margin-bottom:6px}
  .opt{display:flex;gap:11px;align-items:center;padding:7px 0}
  .nm{font-size:13.5px;flex:1}
  .ds{font-size:11.5px;color:var(--ink-soft);display:block;margin-top:1px}
  .step{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .sbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--vino);font-size:16px;font-family:var(--font-display);cursor:pointer;line-height:1}
  .qin{width:44px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 2px;font-family:var(--font-body);font-size:13px;text-align:center}
  .shared{font-size:13.5px;padding:4px 0}
  .shared .tag{font-size:10.5px;color:var(--olive);font-family:var(--font-body)}
  .note{margin:18px 22px 0}
  .note textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-family:var(--font-body);font-size:13px;min-height:64px;resize:vertical}
  .gbox{margin:16px 22px 0;background:var(--page);border-radius:10px;padding:12px 14px;font-family:var(--font-body);font-size:12.5px;color:var(--vino)}
  .btnrow{padding:20px 22px 26px}
  .btn{width:100%;background:var(--vino);color:var(--sabbia);border:none;border-radius:9px;padding:14px;font-size:14px;font-family:var(--font-display);letter-spacing:1px;cursor:pointer}
  .btn:disabled{opacity:.55}
  .ft{text-align:center;font-size:10.5px;color:var(--ink-faint);margin-top:12px;line-height:1.7;font-family:var(--font-body)}
  .msg{text-align:center;padding:60px 24px;font-size:14px;color:var(--ink-mid)}
  .flash{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;max-width:460px;width:calc(100% - 28px);background:var(--vino);color:var(--page);border-radius:10px;padding:11px 14px;font-family:var(--font-body);font-size:13px;box-shadow:0 6px 22px rgba(44,24,16,.3);text-align:center}
  .nm,.dish,.sect-h,.cath,.h2,.total,.sub{font-family:var(--font-display)}
  .save{display:block;margin:0 auto;background:none;border:1px solid var(--line);color:var(--vino);border-radius:20px;padding:9px 22px;font-family:var(--font-display);font-size:12.5px;letter-spacing:1px;cursor:pointer}
  /* A menu the app laid out from a Word file has no designed PDF behind it, so
     this page IS the document — it has to print like one. */
  @page{size:A4;margin:16mm}
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .card{border:none;border-radius:0}
    .noprint{display:none!important}
    .sect{break-inside:avoid;page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card">
  <div class="msg">Loading your menu…</div>
</div></div>
<script>
var SUPA = 'https://paoaivwtkzujmrgrfjuq.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhb2Fpdnd0a3p1am1yZ3JmanVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzAxMzAsImV4cCI6MjA5NjY0NjEzMH0.VynG9PBeIaqRG2lkMEuzskkcB11EhR-UfO9eGYsaUxk';
var q = new URLSearchParams(location.search);
var token = q.get('t')||'', menuKey = q.get('m')||'', guests = parseInt(q.get('g'),10)||0;
var agreedPP = parseFloat(q.get('p')); // the event's agreed per-guest price, when Valentina negotiated one
var menu = null, counts = {};

// ── Allergens ────────────────────────────────────────────────────────────
// They used to live inside the description prose — "…cartoccio style (R)(S)" —
// which meant nothing could check them and they drifted silently: the same
// dish said egg on one menu and dairy on another, and an oven-baked seabass
// was flagged raw and shellfish on two menus at once.
// A course now carries a real field, courses[].allg = { "Dish": ["D","N"] }.
// Menus written before that still keep the codes in the text, so we read
// either — the structured field wins where it exists.
var ALG_RE = /\s*\(([A-Za-z]{1,3})\)/g;
function algOf(c, dish){
  if(c && c.allg && Object.prototype.hasOwnProperty.call(c.allg, dish)){
    return { known:true, list:(c.allg[dish]||[]) };
  }
  var t = (c && c.desc && c.desc[dish]) || '', out = [], m;
  ALG_RE.lastIndex = 0;
  while((m = ALG_RE.exec(t))) out.push(m[1].toUpperCase());
  return { known: out.length > 0, list: out };
}
function descOf(c, dish){
  var t = (c && c.desc && c.desc[dish]) || '';
  return t.replace(ALG_RE, '').trim();
}
// One dish line. A dish with nothing recorded must never look like a dish with
// nothing in it — silence on a guest-facing menu is the dangerous case.
function dishLine(c, dish){
  var d = descOf(c, dish), a = algOf(c, dish), tail;
  // A guest never reads our gap — that is an internal problem and it is now
  // caught before the menu can be printed or sent at all. What every guest
  // reads instead is the footer line, which is true for every dish on every
  // menu: tell us and our chefs will accommodate you.
  if(!a.known) tail = '';
  else if(!a.list.length) tail = 'No declared allergens';
  else tail = '('+a.list.join(')(')+')';
  return d ? (tail ? esc(d)+' '+tail : esc(d)) : tail;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(id){ return document.getElementById(id); }
var flashTimer = null;
function flash(msg){
  var f = el('cl-flash');
  if(!f){ f = document.createElement('div'); f.id='cl-flash'; f.className='flash'; document.body.appendChild(f); }
  f.textContent = msg; f.style.display = 'block';
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ f.style.display='none'; }, 4200);
}
function fail(msg){ el('card').innerHTML = '<div class="brand"><img src="robertos-logo-wordmark.svg" alt="Roberto’s"></div><div class="msg">'+esc(msg)+'</div>'; }

// With a token the page collects the guest's numbers; without one it is a
// beautiful read-only menu — the link Valentina shares on WhatsApp.
var viewOnly = !token;
async function load(){
  if(!menuKey) return fail('This link is incomplete — please use the link Roberto’s sent you, or get in touch and we’ll resend it.');
  try{
    var r = await fetch(SUPA+'/rest/v1/event_set_menus?key=eq.'+encodeURIComponent(menuKey)+'&active=is.true&select=key,name,price_pp,courses',
      { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
    var rows = await r.json();
    if(!r.ok || !rows.length) return fail('This menu is no longer available — please get in touch and we’ll help right away.');
    menu = rows[0];
    render();
  }catch(e){ fail('Could not load the menu — please check your connection and reopen the link.'); }
}

function chooseCourses(){ return (menu.courses||[]).filter(function(c){ return c.choose; }); }

function render(){
  // Header in the house order used by every other guest document: wordmark,
  // the menu's name, the price, then who we are. The price used to sit in the
  // positioning line's place, which is why this page read as off-brand.
  var priceLine = isFinite(agreedPP) ? 'AED '+agreedPP+' per guest'
                : (menu.price_pp!=null ? 'AED '+menu.price_pp+' per guest' : '');
  var h = '<div class="brand"><img src="robertos-logo-wordmark.svg" alt="Roberto’s"></div>'+
    '<div class="sub">'+esc(menu.name)+'</div>'+
    ((!viewOnly&&guests)||priceLine
      ? '<div class="pr">'+(!viewOnly&&guests?guests+' guests':'')+((!viewOnly&&guests)&&priceLine?' · ':'')+priceLine+'</div>'
      : '')+
    '<div class="sub2">DIFC, Dubai — private dining &amp; events</div>';
  if(viewOnly){
    (menu.courses||[]).forEach(function(c){
      var dsc = c.desc||{};
      h += '<div class="sect"><div class="sect-t">'+esc(c.name)+'</div>'+
        (c.choose?'<div class="sect-n">each guest chooses one</div>':'')+
        ((c.choose?c.options:c.items)||[]).map(function(o){
          return '<div class="shared" style="text-align:center">'+esc(o)+'<span class="ds">'+dishLine(c,o)+'</span></div>';
        }).join('')+'</div>';
    });
    h += '<div class="btnrow"><button class="save noprint" onclick="window.print()">Save or print this menu</button>'+
      '<div class="ft">To book your occasion or ask us anything, simply reply to our last email — or write to '+
      '<a href="mailto:reservations@robertos.ae" style="color:var(--vino)">reservations@robertos.ae</a>.<br><br>'+
      (priceLine ? 'All prices are in AED and inclusive of 10% Service Charge and 5% VAT, subject to an additional 7% DIFC Authority Fee.<br>' : '')+
      'Our chefs will do their best to accommodate your dietary requirements.</div></div>';
    el('card').innerHTML = h;
    return;
  }
  if(guests){
    h += '<div class="gbox">For each course below, tell us how many guests would like each dish — the numbers should add up to '+guests+'. Your kitchen brief is prepared from exactly what you enter here.</div>';
  } else {
    h += '<div class="gbox">How many guests will you be?'+
      '<input class="qin" id="cl-g" type="number" min="1" style="width:64px;margin-left:8px" oninput="onGuests(this.value)"></div>';
  }
  (menu.courses||[]).forEach(function(c, ci){
    h += '<div class="sect"><div class="sect-h"><b>'+esc(c.name)+'</b>'+(c.choose?'<span class="cnt" id="cnt-'+ci+'"></span>':'')+'</div>';
    var dsc = c.desc||{};
    if(c.choose){
      counts[c.name] = counts[c.name] || {};
      h += '<div class="hint">How many guests would like each?</div>'+
        (c.options||[]).map(function(o, oi){
          return '<div class="opt"><span class="nm">'+esc(o)+'<span class="ds">'+dishLine(c,o)+'</span></span><span class="step">'+
            '<button class="sbtn" onclick="bump('+ci+','+oi+',-1)">−</button>'+
            '<input class="qin" id="q-'+ci+'-'+oi+'" type="number" min="0" value="" placeholder="0" oninput="setN('+ci+','+oi+',this.value)">'+
            '<button class="sbtn" onclick="bump('+ci+','+oi+',1)">+</button></span></div>';
        }).join('');
    } else {
      h += (c.items||[]).map(function(it){ return '<div class="shared">'+esc(it)+' <span class="tag">— served for everyone</span><span class="ds">'+dishLine(c,it)+'</span></div>'; }).join('');
    }
    h += '</div>';
  });
  h += '<div class="note"><div style="font-size:12px;color:var(--ink-soft);margin-bottom:5px">Anything we should change or know? A vegan main, allergies, the occasion…</div>'+
       '<textarea id="cl-note" maxlength="900"></textarea></div>';
  h += '<div class="btnrow"><button class="btn" id="cl-send" onclick="send()">Send my choices to Roberto’s</button>'+
       '<div class="ft">Our events team will confirm everything back to you.<br>Our chefs will do their best to accommodate your dietary requirements.</div></div>';
  el('card').innerHTML = h;
  sums();
}

function onGuests(v){ guests = parseInt(v,10)||0; sums(); }
function optName(ci, oi){ return menu.courses[ci].options[oi]; }
function setN(ci, oi, v){
  var c = menu.courses[ci];
  var n = parseInt(v,10);
  counts[c.name] = counts[c.name] || {};
  if(n>0) counts[c.name][optName(ci,oi)] = n; else delete counts[c.name][optName(ci,oi)];
  sums();
}
function bump(ci, oi, d){
  var inp = el('q-'+ci+'-'+oi);
  var n = Math.max(0, (parseInt(inp.value,10)||0) + d);
  inp.value = n || '';
  setN(ci, oi, n);
}
function courseSum(c){
  var m = counts[c.name]||{}; var s = 0;
  Object.keys(m).forEach(function(k){ s += Number(m[k])||0; });
  return s;
}
function sums(){
  (menu.courses||[]).forEach(function(c, ci){
    if(!c.choose) return;
    var node = el('cnt-'+ci); if(!node) return;
    var s = courseSum(c);
    if(!guests){ node.textContent = s ? s+' chosen' : ''; node.style.color = 'var(--ink-faint)'; return; }
    if(s===guests){ node.textContent = s+' of '+guests+' ✓'; node.style.color = 'var(--ok)'; }
    else { node.textContent = s+' of '+guests+(s<guests?' — '+(guests-s)+' to go':' — '+(s-guests)+' too many'); node.style.color = s?'var(--err)':'var(--ink-faint)'; }
  });
}
async function send(){
  if(!guests){ flash('First, how many guests will you be?'); var g = el('cl-g'); if(g) g.focus(); return; }
  var short = null;
  chooseCourses().forEach(function(c){ if(!short && courseSum(c)!==guests) short = c; });
  if(short){ flash(short.name+': the numbers add up to '+courseSum(short)+' of '+guests+' guests — please adjust so everyone has a dish.'); return; }
  var btn = el('cl-send'); btn.disabled = true; btn.textContent = 'Sending…';
  try{
    var payload = { token:token, menu_key:menu.key, guests:guests, choices:counts, note:((el('cl-note')||{}).value||'').trim()||null };
    var r = await fetch(SUPA+'/rest/v1/event_menu_choices', { method:'POST',
      headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(payload) });
    if(!r.ok){ var t = await r.text(); throw new Error(t.slice(0,120)); }
    el('card').innerHTML = '<div class="brand"><img src="robertos-logo-wordmark.svg" alt="Roberto’s"></div>'+
      '<div class="msg">Grazie! Your choices have been sent.<br><br>Our events team will confirm everything back to you shortly.</div>';
  }catch(e){
    btn.disabled = false; btn.textContent = 'Send my choices to Roberto’s';
    flash('Could not send — please try again in a moment.');
  }
}
load();
</script>
</body>
</html>
